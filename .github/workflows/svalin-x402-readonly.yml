# One unauthenticated, fixed GET. No credentials, payment proof, signing,
# checkout, activation, on-chain transaction or seller report is sent.
name: Svalin testnet x402 offer (read only)
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offer:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[svalin-x402-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/inspect-x402.test.mjs
      - name: Read one fixed public offer
        run: |
          set -euo pipefail
          if ! node agent/inspect-x402.mjs --url https://svalin-api.noobshole.workers.dev/v1/portfolio/near.testnet > "$RUNNER_TEMP/svalin-offer.json" 2> "$RUNNER_TEMP/svalin-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/svalin-error.log").read()[-2000:]; print("::error title=Anonymous Svalin offer unavailable::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/svalin-offer.json")),separators=(",",":")); print("::notice title=Anonymous Svalin x402 offer::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          {
            echo '## Anonymous public x402 offer only'
            echo 'One fixed GET; no credentials, payment, checkout, transaction or independent fulfillment. Exact-scheme support is not implied by an onchain-proof wire candidate.'
            echo '```json'
            cat "$RUNNER_TEMP/svalin-offer.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
