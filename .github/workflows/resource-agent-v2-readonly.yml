# Read-only testnet preflight; no signing, broadcast, provider call or keys.
name: Replacement resource-agent preflight (read only)
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[resource-agent-v2-readonly]') || contains(github.event.head_commit.message, '[resource-agent-v2-control-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test resource-agent preflight and original-hash guards
        run: node --test tests/testnet-resource-agent-*.test.mjs
      - name: Inspect one pinned FINAL testnet state
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          script=scripts/inspect-resource-agent-v2.mjs
          if [[ "$COMMIT_MESSAGE" == *'[resource-agent-v2-control-readonly]'* ]]; then script=scripts/inspect-resource-agent-v2-control.mjs; fi
          if ! node "$script" > "$RUNNER_TEMP/resource-agent-preflight.json" 2> "$RUNNER_TEMP/resource-agent-preflight-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/resource-agent-preflight-error.log").read()[-4000:]; print("::error title=Resource-agent preflight unavailable::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## Replacement resource-agent read-only preflight'
            echo 'No policy change, key installation, seller contact or payment was made.'
            echo '```json'
            cat "$RUNNER_TEMP/resource-agent-preflight.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/resource-agent-preflight.json")),separators=(",",":")); print("::notice title=Replacement resource-agent preflight::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
