# Unpaid read-only USGS check. The seller response is synthetic, and no
# provider, wallet, on-chain transaction or live fulfillment is involved.
name: Check direct USGS corroboration path
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  usgs:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[usgs-evidence-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install and test evidence validation
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/tollgate-response-store.test.mjs tests/tollgate-quakes-corroboration.test.mjs
      - name: Compare two direct public USGS observations
        run: |
          set -euo pipefail
          if ! node scripts/probe-usgs-corroboration.mjs > "$RUNNER_TEMP/usgs-probe.json" 2> "$RUNNER_TEMP/usgs-probe-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/usgs-probe-error.log").read()[-2500:]; print("::error title=Unpaid USGS check unavailable::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/usgs-probe.json")),separators=(",",":")); print("::notice title=Unpaid USGS comparison::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Direct USGS check'; echo 'Synthetic seller projection only. No payment or independent provider delivery.'; echo '```json'; cat "$RUNNER_TEMP/usgs-probe.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
