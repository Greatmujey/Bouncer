# Disposable local nearcore and local synthetic seller data only. No keys,
# public-chain transaction, live provider contact or Circle payment.
name: Test V13 one-shot data client locally
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  local-http:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[v13-http-sandbox]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test guarded client and retrieve pinned public fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/tollgate-quakes-v13.test.mjs tests/tollgate-v12-readiness.test.mjs tests/v11-sandbox-setup-rpc.test.mjs
          gh api repos/Greatmujey/Bouncer/git/blobs/f3ad44590b1d816bf0d4c6ceb29e6c917c01056c --jq '.content' | tr -d '\n' | base64 -d > "$RUNNER_TEMP/v13-voucher.wasm"
          test "$(sha256sum "$RUNNER_TEMP/v13-voucher.wasm" | cut -d' ' -f1)" = 'ed1bb4fb01313576f88c719d5c7283d2366a60c580295863a759f5f9ee699231'
          gh api repos/Mattbusel/tollgate/git/blobs/da71fa08c368f7620bc4bd2e8512a57580a86e15 --jq '.content' | tr -d '\n' | base64 -d > "$RUNNER_TEMP/tollgate.wasm"
          test "$(sha256sum "$RUNNER_TEMP/tollgate.wasm" | cut -d' ' -f1)" = '1142c2546565f70944d578cea15d03c58166797525cd40d863a3425b1afd6956'
          mkdir -p "$RUNNER_TEMP/seller/src/core" "$RUNNER_TEMP/seller/src/seller"
          for file in src/core/voucher.mjs src/seller/tollgate.mjs src/seller/store.mjs; do
            gh api "repos/Mattbusel/tollgate/contents/$file?ref=ab9c13fbd9efea70ac27c6e35623925ecd0b9a6f" --jq '.content' | tr -d '\n' | base64 -d > "$RUNNER_TEMP/seller/$file"
          done
          test "$(sha256sum "$RUNNER_TEMP/seller/src/core/voucher.mjs" | cut -d' ' -f1)" = '51739a45a9a7e3a83fe411d2cf2f2e0d5ff3518fc4f0717225247181689f97b3'
          test "$(sha256sum "$RUNNER_TEMP/seller/src/seller/tollgate.mjs" | cut -d' ' -f1)" = 'c83c65bced260297bbd2188877e91f45f7ae70b936860dcd29c75e76dc60dd77'
          test "$(sha256sum "$RUNNER_TEMP/seller/src/seller/store.mjs" | cut -d' ' -f1)" = '8b3264f9cc0250126bd3a0cdec665ba1fc29b7907bf6802b9782534ea2a34bfe'
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 --max-time 180 --retry 2 --max-filesize 419430400 \
            'https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.14.0/near-sandbox.tar.gz' \
            --output "$RUNNER_TEMP/near-sandbox.tar.gz"
          python3 scripts/extract-pinned-near-sandbox.py "$RUNNER_TEMP/near-sandbox.tar.gz" "$RUNNER_TEMP/near-sandbox"
      - name: Exercise local HTTP purchase, settlement and refund
        env:
          BOUNCER_SANDBOX_BIN: ${{ runner.temp }}/near-sandbox
          BOUNCER_V13_WASM_PATH: ${{ runner.temp }}/v13-voucher.wasm
          BOUNCER_TOLLGATE_WASM_PATH: ${{ runner.temp }}/tollgate.wasm
          BOUNCER_TOLLGATE_SELLER_FIXTURES: ${{ runner.temp }}/seller
        run: |
          set -euo pipefail
          ulimit -Sn 65535
          if ! node integration/v13-tollgate-http-sandbox-runner.mjs > "$RUNNER_TEMP/v13-http-result.json" 2> "$RUNNER_TEMP/v13-http-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/v13-http-error.log").read()[-4000:]; print("::error title=Local data client sandbox failed::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/v13-http-result.json")),separators=(",",":")); print("::notice title=Local data client sandbox result::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Local one-shot data-client lifecycle'; echo 'Pinned seller SDK, synthetic quakes, and disposable local chain only. No live purchase or independent data.'; echo '```json'; cat "$RUNNER_TEMP/v13-http-result.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
