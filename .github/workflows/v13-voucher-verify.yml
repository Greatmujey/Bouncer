# Experimental reproducible build and isolated sandbox only. No private keys,
# public-chain transactions, provider HTTP requests or deployment.
name: Verify voucher-aware V13 in sandbox
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  build:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[v13-voucher-verify]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        instance: [a, b]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - name: Build locked optimized code from this commit
        working-directory: bouncer/contracts/bouncer
        env:
          CARGO_PROFILE_RELEASE_LTO: 'true'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: z
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
          RUSTFLAGS: '-C link-arg=-s'
        run: |
          set -euo pipefail
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = '263879a4574d1d5ed97dd0da097cdefff52b4f57017738ad291628a9c63e317f'
          cargo build --locked --target wasm32-unknown-unknown --release --no-default-features --features tollgate-native-v13
          curl --fail --silent --show-error --location 'https://registry.npmjs.org/binaryen/-/binaryen-119.0.0.tgz' -o "$RUNNER_TEMP/binaryen.tgz"
          python3 - <<'PY'
          import base64,hashlib,os,pathlib
          b=(pathlib.Path(os.environ['RUNNER_TEMP'])/'binaryen.tgz').read_bytes()
          if base64.b64encode(hashlib.sha512(b).digest()).decode()!='DTdcs8ijrj2OIEftWVPVkYsgJ8MzlYH+uSsC8156g88E7CNaG8kEfWNGSXxb3tPlzadrm6sD3mgSEKKZJu4Q3g==':
              raise ValueError('Binaryen package integrity mismatch')
          PY
          mkdir "$RUNNER_TEMP/binaryen" "$RUNNER_TEMP/v13-voucher-result"
          tar -xzf "$RUNNER_TEMP/binaryen.tgz" -C "$RUNNER_TEMP/binaryen"
          node "$RUNNER_TEMP/binaryen/package/bin/wasm-opt" target/wasm32-unknown-unknown/release/bouncer.wasm -Oz --enable-bulk-memory --enable-reference-types -o "$RUNNER_TEMP/v13-voucher-result/bouncer.wasm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v13-voucher-${{ matrix.instance }}-${{ github.run_id }}
          path: ${{ runner.temp }}/v13-voucher-result/bouncer.wasm
          retention-days: 30
          if-no-files-found: error
  compare:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # retain matching public WASM only
    timeout-minutes: 5
    outputs:
      sha256: ${{ steps.retain.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v13-voucher-a-${{ github.run_id }}
          path: ${{ runner.temp }}/v13-voucher-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v13-voucher-b-${{ github.run_id }}
          path: ${{ runner.temp }}/v13-voucher-b
      - name: Compare and retain identical public code
        id: retain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP']); a=(r/'v13-voucher-a/bouncer.wasm').read_bytes(); b=(r/'v13-voucher-b/bouncer.wasm').read_bytes()
          if a!=b or not 100_000<len(a)<2_000_000 or a[:8]!=b'\0asm\1\0\0\0' or b'bouncer-agent-v13-tollgate-native-testnet' not in a or b'is_tollgate_voucher_authorized' not in a:
              raise ValueError('optimized builds differ or required exports are missing')
          digest=hashlib.sha256(a).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'sha256={digest}\n')
          (r/'v13-voucher-blob-request.json').write_text(json.dumps({'content':base64.b64encode(a).decode(),'encoding':'base64'}))
          (r/'v13-voucher-report.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'sha256':digest,'bytes':len(a),'matching_github_builds':2,'independently_audited':False,'deployed':False}))
          PY
          gh api --method POST repos/Greatmujey/Bouncer/git/blobs --input "$RUNNER_TEMP/v13-voucher-blob-request.json" > "$RUNNER_TEMP/v13-voucher-blob.json"
          python3 - <<'PY'
          import json,os,pathlib,re
          r=pathlib.Path(os.environ['RUNNER_TEMP']); blob=json.loads((r/'v13-voucher-blob.json').read_text()); report=json.loads((r/'v13-voucher-report.json').read_text())
          if not re.fullmatch(r'[a-f0-9]{40}',blob.get('sha','')): raise ValueError('invalid public blob')
          report['git_blob']=blob['sha']; print('::notice title=Voucher-aware V13 matching builds::'+json.dumps(report,separators=(',',':')))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('## Matching experimental builds\nNot deployed or independently audited.\n```json\n'+json.dumps(report,indent=2)+'\n```\n')
          PY
  sandbox:
    needs: compare
    if: needs.compare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v13-voucher-a-${{ github.run_id }}
          path: ${{ runner.temp }}/v13-voucher
      - name: Test local guards and retrieve pinned sandbox fixtures
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.compare.outputs.sha256 }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/v13-sandbox-tollgate.test.mjs tests/v11-sandbox-setup-rpc.test.mjs
          test "$(sha256sum "$RUNNER_TEMP/v13-voucher/bouncer.wasm" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          gh api repos/Mattbusel/tollgate/git/blobs/da71fa08c368f7620bc4bd2e8512a57580a86e15 --jq '.content' | tr -d '\n' | base64 -d > "$RUNNER_TEMP/tollgate.wasm"
          test "$(sha256sum "$RUNNER_TEMP/tollgate.wasm" | cut -d' ' -f1)" = '1142c2546565f70944d578cea15d03c58166797525cd40d863a3425b1afd6956'
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 --max-time 180 --retry 2 --max-filesize 419430400 \
            'https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.14.0/near-sandbox.tar.gz' \
            --output "$RUNNER_TEMP/near-sandbox.tar.gz"
          python3 scripts/extract-pinned-near-sandbox.py "$RUNNER_TEMP/near-sandbox.tar.gz" "$RUNNER_TEMP/near-sandbox"
      - name: Exercise voucher-aware code in isolated nearcore
        env:
          BOUNCER_SANDBOX_BIN: ${{ runner.temp }}/near-sandbox
          BOUNCER_V13_WASM_PATH: ${{ runner.temp }}/v13-voucher/bouncer.wasm
          BOUNCER_V13_WASM_SHA256: ${{ needs.compare.outputs.sha256 }}
          BOUNCER_V13_VOUCHER_VIEW: 'true'
          BOUNCER_TOLLGATE_WASM_PATH: ${{ runner.temp }}/tollgate.wasm
        run: |
          set -euo pipefail
          ulimit -Sn 65535
          if ! node integration/v13-tollgate-sandbox-runner.mjs > "$RUNNER_TEMP/v13-voucher-sandbox.json" 2> "$RUNNER_TEMP/v13-voucher-sandbox-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/v13-voucher-sandbox-error.log").read()[-4000:]; print("::error title=Voucher-aware V13 sandbox failed::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/v13-voucher-sandbox.json")),separators=(",",":")); print("::notice title=Voucher-aware V13 local sandbox result::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Isolated voucher-aware channel lifecycle'; echo 'Local seller and synthetic voucher only. Not an audit, Circle payment or real provider delivery.'; echo '```json'; cat "$RUNNER_TEMP/v13-voucher-sandbox.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
