# Public testnet contract-code lookup only. Never signs or broadcasts.
name: Read-only V12 global-code lookup

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[global-v12-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Look up reviewed V12 code by immutable global hash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const codeHash = 'Dg53QzTrw3cDWdgYTptmpkqvoeUpSXQsxL5HLcoF6Cq';
          const expectedSha = '033f255c5822ff97495809f7d60fddf66f266f20c36285fe71296b66decc6d12';
          const response = await fetch('https://test.rpc.fastnear.com', {
            method: 'POST', headers: { 'content-type': 'application/json' }, signal: AbortSignal.timeout(25000),
            body: JSON.stringify({ jsonrpc: '2.0', id: 'bouncer-global-v12', method: 'query',
              params: { request_type: 'view_global_contract_code', finality: 'final', code_hash: codeHash } }),
          });
          if (!response.ok) throw new Error(`testnet RPC HTTP ${response.status}`);
          const text = await response.text();
          if (text.length > 1_000_000) throw new Error('unexpectedly large RPC result');
          const json = JSON.parse(text);
          if (json.id !== 'bouncer-global-v12' || json.jsonrpc !== '2.0') throw new Error('invalid RPC envelope');
          let result;
          if (json.error) {
            result = { found: false, rpc_error: json.error, absence_verified: false };
          } else {
            const value = json.result;
            if (typeof value?.code_base64 !== 'string' || value.code_base64.length > 800_000 ||
                !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value.code_base64)) {
              throw new Error('malformed public code result');
            }
            const code = Buffer.from(value.code_base64, 'base64');
            const actualSha = crypto.createHash('sha256').update(code).digest('hex');
            result = { found: true, bytes: code.length, sha256: actualSha,
              matches_reviewed_v12: code.length === 536651 && actualSha === expectedSha,
              block_hash: value.block_hash, block_height: value.block_height };
          }
          const report = { network: 'testnet', requested_code_hash: codeHash, ...result,
            wallet_connected: false, approval_requested: false, transaction_sent: false,
            scope: 'One public FINAL testnet RPC view. A match would not itself deploy a vault or prove wallet compatibility.' };
          const message = JSON.stringify(report);
          if (message.length > 8000) throw new Error('unexpected RPC error size');
          console.log('::notice title=Public V12 global-code lookup::' + message.replace(/%/g,'%25').replace(/\n/g,'%0A').replace(/\r/g,'%0D'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Public testnet global-code lookup\n\n```json\n' + JSON.stringify(report, null, 2) + '\n```\n');
          JS
