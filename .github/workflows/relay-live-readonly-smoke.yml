# Explicitly dispatched, read-only check of the deployed relay's public boundary.
# Never signs, broadcasts, contacts a wallet, or sends a valid relay job.
name: Deployed testnet relay boundary (read only)
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay-boundary:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[relay-live-smoke]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check production-origin CORS and deny an unsigned job
        run: node bouncer/scripts/check-live-readonly-relay.mjs
      - name: Check direct archival RPC browser compatibility (read-only)
        continue-on-error: true
        run: node bouncer/scripts/check-native-archive-cors.mjs
