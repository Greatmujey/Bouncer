# ONE-SHOT TESTNET CIRCLE FUNDING FOR THE BACKED-UP V3 KEYLESS V12 VAULT.
# Public signed bytes can be relayed by anyone. Never resend an unresolved hash.
name: Fund backed-up V12 vault with Circle test USDC once

on:
  push:
    branches: ['arena/25a7aaf6-near-hub']

permissions:
  contents: read
  actions: read

jobs:
  fund:
    if: github.event.before == 'e24c824a2e47c956ebf844f0774a2c201cd5315f' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[vault-circle-v3-v12-fund-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Retrieve pinned public V12 artifact for safety tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Greatmujey/Bouncer/git/blobs/16785505eaed13609d8e569e7b1665f89683d9eb --jq .content | base64 -d > "$RUNNER_TEMP/v12-testnet.wasm"
          printf '%s  %s\n' '033f255c5822ff97495809f7d60fddf66f266f20c36285fe71296b66decc6d12' "$RUNNER_TEMP/v12-testnet.wasm" | sha256sum -c -
          test "$(wc -c < "$RUNNER_TEMP/v12-testnet.wasm")" -eq 536651
      - name: Test fixed action, journal, fence and receipt guards
        env:
          BOUNCER_V12_WASM: ${{ runner.temp }}/v12-testnet.wasm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/keyless-vault-v12-circle*.test.mjs tests/github-original-fence.test.mjs tests/read-only-near-receipts.test.mjs
      - name: Prepare original-hash fence
        id: fence_info
        run: |
          set -euo pipefail
          file='evidence/testnet-owner-v3/vault-v12-circle-fund-original.json'
          test -f "$file"
          digest="$(sha256sum "$file" | cut -d' ' -f1)"
          echo "sha=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/vault-circle-fund-fence"
          cp "$file" "$RUNNER_TEMP/vault-circle-fund-fence/fund-original.json"
          printf 'network=testnet\nrun_id=%s\ncommit=%s\nenvelope_sha256=%s\nrequest=one Circle testnet vault funding; reconcile, never blindly resend\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$digest" > "$RUNNER_TEMP/vault-circle-fund-fence/attempt.txt"
      - name: Retain original-hash fence before CI send
        id: fence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vault-circle-v3-v12-fund-fence-${{ github.run_id }}-${{ steps.fence_info.outputs.sha }}
          path: ${{ runner.temp }}/vault-circle-fund-fence/
          retention-days: 30
          if-no-files-found: error
      - name: Recheck fresh state, submit once, and verify original receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOUNCER_FENCE_ARTIFACT_ID: ${{ steps.fence.outputs.artifact-id }}
          BOUNCER_VAULT_CIRCLE_KIND: fund
        run: |
          set -euo pipefail
          if ! node scripts/broadcast-vault-circle-v3-v12-once.mjs > "$RUNNER_TEMP/vault-circle-fund-result.json" 2> "$RUNNER_TEMP/vault-circle-fund-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/vault-circle-fund-error.log").read()[-4000:]; print("::error title=Original vault Circle funding unconfirmed; do not retry::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## One backed-up V12 Circle testnet vault funding'
            echo 'Owner signed locally; this moves test USDC into the keyless vault, not to a seller. It is not provider delivery.'
            echo '```json'
            cat "$RUNNER_TEMP/vault-circle-fund-result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/vault-circle-fund-result.json")),separators=(",",":")); print("::notice title=V12 vault Circle funding result::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
