# One public testnet status read through the temporary encrypted relay.
# No wallet, private key, NEAR transaction or secret is uploaded to GitHub.
name: Encrypted testnet relay smoke (read only)
on:
  push:
    branches: ['arena/**']
permissions:
  contents: read
jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[relay-smoke]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Trigger the signed read-only status job
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const input = fs.readFileSync('bouncer/evidence/relay-smoke-request.json', 'utf8');
          const response = await fetch('https://bouncer-testnet-readonly-relay-tau.vercel.app/api/read', {
            method: 'POST', headers: { 'content-type': 'application/json', origin: 'https://4173-inmo7hprqq1v5gwehl2sd.e2b.app' },
            body: input, signal: AbortSignal.timeout(25000), redirect: 'error',
          });
          const text = await response.text();
          if (!response.ok || text.length > 12000) throw new Error(`Encrypted relay unavailable (HTTP ${response.status})`);
          const envelope = JSON.parse(text);
          if (envelope.version !== 1 || !envelope.ciphertext_base64 || !envelope.encrypted_key_base64) throw new Error('Missing encrypted result');
          console.log('::notice title=Encrypted relay response::' + JSON.stringify(envelope).replaceAll('%', '%25'));
          console.log('Read-only encrypted response returned. The GitHub runner cannot decrypt or verify it.');
          NODE
