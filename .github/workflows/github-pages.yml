name: Publish the read-only Bouncer website

# Pages must first be enabled for this repository with GitHub Actions as the
# publishing source. This workflow cannot change repo visibility or enable
# Pages by itself. Private-repository Pages also depends on the GitHub plan.
on:
  push:
    branches: [main]
    paths:
      - 'bouncer/web/**'
      - 'bouncer/scripts/stage-public-web.mjs'
      - 'bouncer/tests/public-web-staging.test.mjs'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bouncer-github-pages
  cancel-in-progress: false

jobs:
  publish:
    # Manual dispatch must not publish an unreviewed feature branch either.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test public-site and wallet safeguards
        run: node --test bouncer/tests/public-web-staging.test.mjs bouncer/tests/web.test.mjs bouncer/tests/wallet.test.mjs
      - name: Configure already-enabled GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage only approved public files
        run: node bouncer/scripts/stage-public-web.mjs "$RUNNER_TEMP/bouncer-public-site"
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/bouncer-public-site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
