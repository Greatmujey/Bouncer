# Read-only original-hash recovery. No signing, key access or broadcast.
name: Reconcile replacement vault Circle (read only)

on:
  push:
    branches: ['arena/25a7aaf6-near-hub']

permissions:
  contents: read

jobs:
  reconcile:
    if: github.run_attempt == 1 && (contains(github.event.head_commit.message, '[vault-circle-v2-reconcile-register]') || contains(github.event.head_commit.message, '[vault-circle-v2-reconcile-fund]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies and test read-only receipt transport
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/read-only-near-receipts.test.mjs tests/keyless-vault-circle.test.mjs
      - name: Reconcile only the retained original hash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$COMMIT_MESSAGE" == *'[vault-circle-v2-reconcile-register]'* && "$COMMIT_MESSAGE" != *'[vault-circle-v2-reconcile-fund]'* ]]; then kind=register
          elif [[ "$COMMIT_MESSAGE" == *'[vault-circle-v2-reconcile-fund]'* && "$COMMIT_MESSAGE" != *'[vault-circle-v2-reconcile-register]'* ]]; then kind=fund
          else echo 'Select exactly one original action' >&2; exit 1; fi
          if ! node scripts/reconcile-vault-circle-v2.mjs "$kind" > "$RUNNER_TEMP/vault-circle-reconcile.json" 2> "$RUNNER_TEMP/vault-circle-reconcile-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/vault-circle-reconcile-error.log").read()[-3000:]; print("::error title=Original vault Circle action remains unresolved; do not resend::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## Read-only original Circle vault reconciliation'
            echo 'No signatures or transactions; the RPC is trusted, not a consensus proof.'
            echo '```json'
            cat "$RUNNER_TEMP/vault-circle-reconcile.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/vault-circle-reconcile.json")),separators=(",",":")); print("::notice title=Replacement vault Circle original reconciliation::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
