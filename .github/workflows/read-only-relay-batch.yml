# Diagnostic only: relay a short-lived list of public testnet RPC reads.
# OIDC tokens and responses are encrypted for the local preview backend. This
# workflow has no wallet, signer, seller-order or transaction-send capability.
name: Phone preview read-only relay batch
on:
  push:
    branches: ['arena/**']
permissions:
  contents: read
jobs:
  relay:
    if: contains(github.event.head_commit.message, '[relay-batch]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Relay one bounded batch without decrypting results
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const jobs = JSON.parse(fs.readFileSync('bouncer/evidence/relay-batch-public-jobs.json', 'utf8'));
          if (!Array.isArray(jobs) || jobs.length < 1 || jobs.length > 32) throw new Error('Invalid batch');
          const envelopes = await Promise.all(jobs.map(async job => {
            const response = await fetch('https://bouncer-testnet-readonly-relay-tau.vercel.app/api/read', {
              method: 'POST', headers: { 'content-type': 'application/json', origin: 'https://4173-inmo7hprqq1v5gwehl2sd.e2b.app' },
              body: JSON.stringify(job), signal: AbortSignal.timeout(20000), redirect: 'error',
            });
            if (!response.ok) throw new Error(`Read-only relay failed (HTTP ${response.status})`);
            const text = await response.text();
            if (text.length > 1900000) throw new Error('Read-only relay response too large');
            const result = JSON.parse(text);
            if (result.version !== 1 || result.job_id !== job.job_id) throw new Error('Incorrect encrypted response');
            return result;
          }));
          fs.writeFileSync('relay-envelopes.json', JSON.stringify(envelopes));
          console.log(`Relayed ${envelopes.length} encrypted public RPC result(s); no wallet or transaction used.`);
          NODE
      - name: Retain encrypted results briefly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encrypted-relay-batch
          path: relay-envelopes.json
          retention-days: 1
          if-no-files-found: error
