# One public, already-completed V3 testnet funding transaction, read-only.
# This never reads a key, sends or retries a transaction, or pays a seller.
name: Historical Circle funding receipt closure (read only)

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-original:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[historical-circle-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned read-only dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the one existing original receipt graph
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-historical-circle-funding.mjs | tee "$RUNNER_TEMP/historical-circle-funding.json"
          printf '## Historical testnet funding only — no new payment\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/historical-circle-funding.json" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
