# Public, unpaid HTTP offer and pinned testnet views; no key or transaction.
name: V12 independent data offer discovery (read only)
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  discover:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[tollgate-v12-discovery]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked dependencies and test read-only guards
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/tollgate-v12-readiness.test.mjs tests/read-only-near-receipts.test.mjs
      - name: Fetch one unpaid public data offer and pinned V12/channel views
        run: |
          set -euo pipefail
          if ! node scripts/inspect-tollgate-v12-v3.mjs > "$RUNNER_TEMP/tollgate.json" 2> "$RUNNER_TEMP/tollgate-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/tollgate-error.log").read()[-2000:]; print("::error title=Unpaid Tollgate discovery unavailable::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/tollgate.json")),separators=(",",":")); print("::notice title=Unpaid Tollgate and V12 state::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Independent data offer — read only'; echo 'Public 402 offer and trusted-RPC views only. No voucher, channel, payment, seller delivery, source proof or audit.'; echo '```json'; cat "$RUNNER_TEMP/tollgate.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
