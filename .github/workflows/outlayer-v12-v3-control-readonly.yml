# Read-only state for a separate zero-yocto nonce fence. No send or key upload.
name: Inspect V3 V12 registration nonce control (read only)
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  inspect:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[outlayer-v12-v3-control-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/outlayer-v12-registration-control.test.mjs tests/outlayer-v12-registration-control-runner.test.mjs tests/outlayer-v12-registration-control-journal.test.mjs tests/outlayer-v12-burn-registration.test.mjs tests/github-original-fence.test.mjs
      - name: Inspect original nonce and control slot
        run: |
          set -euo pipefail
          if ! node scripts/inspect-outlayer-v12-v3-registration-control.mjs > "$RUNNER_TEMP/outlayer-control-snapshot.json" 2> "$RUNNER_TEMP/outlayer-control-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/outlayer-control-error.log").read()[-2500:]; print("::error title=Control state unknown::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/outlayer-control-snapshot.json")),separators=(",",":")); print("::notice title=V3 V12 registration control preflight::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Read-only control preflight'; echo 'No signature or send. An unavailable original receipt is not proof of absence.'; echo '```json'; cat "$RUNNER_TEMP/outlayer-control-snapshot.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
