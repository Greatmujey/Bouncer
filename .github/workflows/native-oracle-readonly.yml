# Public FINAL testnet views and pinned-code lookup. Never signs or broadcasts.
name: Native OutLayer wallet readiness (read only)
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[native-oracle-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test offline plan, receipt evidence and read-only boundaries
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/native-oracle-wallet-plan.test.mjs tests/native-oracle-wallet-evidence.test.mjs tests/native-oracle-readiness.test.mjs tests/oracle-outlayer.test.mjs tests/direct-outlayer-testnet.test.mjs tests/wallet.test.mjs
      - name: Check direct-test browser RPC and pinned project (read only)
        run: node scripts/check-direct-outlayer-readiness.mjs
      - name: Check public historical direct-receipt shape (synthetic, read only)
        run: node scripts/probe-outlayer-direct-receipt.mjs
      - name: Inspect named wallet and native OutLayer project
        run: |
          set -euo pipefail
          node scripts/inspect-native-oracle-readiness.mjs > "$RUNNER_TEMP/native-oracle-readiness.json"
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.environ['RUNNER_TEMP'] + '/native-oracle-readiness.json'))
          text = json.dumps(data, separators=(',', ':'), ensure_ascii=True)
          assert len(text) < 12000
          print('::notice title=Native OutLayer read-only readiness::' + text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          { echo '## Native OutLayer wallet readiness: public read-only views';
            echo 'No wallet approval, transaction, vault, purchase or delivery. Estimates can change and keyless storage funding can lock test NEAR.';
            echo '```json'; cat "$RUNNER_TEMP/native-oracle-readiness.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check whether the exact V9 artifact is already globally available
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const codeHash = '9qpU6d6MHZZXC2ivtQt3k3scGkiHLkkMnaTAiZWbaL6y';
          const sha = '835f0baa51d08ddf3af6812df0caefb93283480735a63e3d382073e04fbaf8ee';
          let result = { found: false, matches_pinned_v9: false, absence_verified: false };
          try {
            const response = await fetch('https://test.rpc.fastnear.com', { method: 'POST', headers: { 'content-type': 'application/json' },
              signal: AbortSignal.timeout(20000), body: JSON.stringify({ jsonrpc: '2.0', id: 'bouncer-global-v9', method: 'query',
                params: { request_type: 'view_global_contract_code', finality: 'final', code_hash: codeHash } }) });
            if (!response.ok) throw Error('unavailable');
            const text = await response.text(); if (text.length > 1000000) throw Error('oversized');
            const body = JSON.parse(text); if (body.id !== 'bouncer-global-v9' || body.jsonrpc !== '2.0') throw Error('invalid');
            const value = body.result;
            if (typeof value?.code_base64 === 'string' && value.code_base64.length <= 800000 &&
                /^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value.code_base64)) {
              const bytes = Buffer.from(value.code_base64, 'base64');
              const actual = crypto.createHash('sha256').update(bytes).digest('hex');
              result = { found: true, matches_pinned_v9: bytes.length === 452675 && actual === sha,
                bytes: bytes.length, sha256: actual, block_hash: value.block_hash, absence_verified: false };
            }
          } catch { /* an unavailable result does not prove absence */ }
          result = { network: 'testnet', requested_code_hash: codeHash, ...result, signed: false, sent: false,
            scope: 'one public FINAL RPC view; a match would not establish wallet support, deployment or authorization' };
          const message = JSON.stringify(result);
          console.log('::notice title=Public V9 global-code lookup::' + message);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n## Public V9 global-code lookup\n\n```json\n' + JSON.stringify(result, null, 2) + '\n```\n');
          JS
