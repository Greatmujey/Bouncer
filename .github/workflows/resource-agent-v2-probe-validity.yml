# Read-only original-block validity and pinned owner nonce. Never signs or sends.
name: Inspect original guard probe validity (read only)
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[resource-agent-v2-probe-validity]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/testnet-resource-agent-expiry.test.mjs
      - name: Inspect only the original probe's block and same-block state
        run: |
          set -euo pipefail
          if ! node scripts/inspect-resource-agent-v2-probe-validity.mjs > "$RUNNER_TEMP/probe-validity.json" 2> "$RUNNER_TEMP/probe-validity-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/probe-validity-error.log").read()[-4000:]; print("::error title=Original probe validity unknown::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## Original guard-probe read-only diagnostics'
            echo 'No transaction was signed or sent. Receipt remains unknown unless separately verified.'
            echo '```json'
            cat "$RUNNER_TEMP/probe-validity.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/probe-validity.json")),separators=(",",":")); print("::notice title=Original guard probe validity::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
