# Public key and state only. Never signs, sends, orders or contacts a seller HTTP endpoint.
name: OutLayer diagnostic stage preflight (read only)
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[outlayer-burn-preflight:')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install and test offline diagnostic boundaries
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/outlayer-v11-burn-plan.test.mjs tests/outlayer-v11-burn-preflight.test.mjs tests/outlayer-v11-burn-signed.test.mjs tests/outlayer-v11-burn-keyring.test.mjs
      - name: Inspect one specified stage at a FINAL block
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          stage="$(python3 -c 'import os,re; x=re.findall(r"\[outlayer-burn-preflight:(register-fake|wrap|swap-fake|fund-vault|configure|install-keys|fund-provider|run-project)\]",os.environ["COMMIT_MESSAGE"]); assert len(x)==1; print(x[0])')"
          if ! node scripts/inspect-outlayer-burn-stage.mjs "$stage" > "$RUNNER_TEMP/outlayer-burn-stage.json" 2> "$RUNNER_TEMP/outlayer-burn-stage-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/outlayer-burn-stage-error.log").read()[-3000:]; print("::error title=OutLayer diagnostic stage unknown; no send::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/outlayer-burn-stage.json")),separators=(",",":")); print("::notice title=OutLayer fixed-stage public preflight::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          {
            echo '## OutLayer diagnostic public preflight'
            echo 'No private key, transaction or seller order. State is a trusted-RPC indication, not evidence of earlier receipts or delivery.'
            echo '```json'
            cat "$RUNNER_TEMP/outlayer-burn-stage.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
