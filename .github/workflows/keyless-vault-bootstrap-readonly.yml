name: Keyless testnet vault preflight (read only)

on:
  push:
    branches: ['arena/25a7aaf6-near-hub']

permissions:
  contents: read

jobs:
  inspect:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[keyless-vault-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install lockfile and test pinned read-only checks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/keyless-vault-bootstrap-readiness.test.mjs tests/circle-owner-registration.test.mjs tests/circle-owner-acquisition*.test.mjs
      - name: Inspect new direct-child vault without keys or transactions
        run: |
          set -euo pipefail
          if ! node scripts/inspect-keyless-vault-bootstrap.mjs > "$RUNNER_TEMP/vault-preflight.json" 2> "$RUNNER_TEMP/vault-preflight-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/vault-preflight-error.log").read()[-3000:]; print("::error title=Keyless vault preflight unavailable or blocked::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            test ! -s "$RUNNER_TEMP/vault-preflight.json" || python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/vault-preflight.json")),separators=(",",":")); print("::notice title=Keyless vault preflight::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## Provider-neutral keyless vault preflight'
            echo 'No private key, signature, transaction, deployment or seller call. Storage estimates, code identity, backup and runtime compatibility are not guarantees.'
            echo '```json'
            cat "$RUNNER_TEMP/vault-preflight.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/vault-preflight.json")),separators=(",",":")); print("::notice title=Keyless vault preflight::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
