# Public testnet views only. No signatures, transactions or seller contact.
name: Backed-up V12 vault Circle preflight (read only)
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  inspect:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[vault-circle-v3-v12-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Retrieve pinned public V12 artifact for offline journal tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Greatmujey/Bouncer/git/blobs/16785505eaed13609d8e569e7b1665f89683d9eb --jq .content | base64 -d > "$RUNNER_TEMP/v12-testnet.wasm"
          printf '%s  %s\n' '033f255c5822ff97495809f7d60fddf66f266f20c36285fe71296b66decc6d12' "$RUNNER_TEMP/v12-testnet.wasm" | sha256sum -c -
          test "$(wc -c < "$RUNNER_TEMP/v12-testnet.wasm")" -eq 536651
      - name: Test V12 Circle guards and original-hash recovery
        env:
          BOUNCER_V12_WASM: ${{ runner.temp }}/v12-testnet.wasm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/keyless-vault-v12-circle*.test.mjs tests/github-original-fence.test.mjs tests/read-only-near-receipts.test.mjs
      - name: Inspect owner, keyless V12 vault and Circle at one FINAL block
        run: |
          set -euo pipefail
          if ! node scripts/inspect-vault-circle-v3-v12.mjs > "$RUNNER_TEMP/v12-circle-preflight.json" 2> "$RUNNER_TEMP/v12-circle-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/v12-circle-error.log").read()[-3000:]; print("::error title=V12 vault Circle preflight unavailable::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## Read-only backed-up V12 vault Circle preflight'
            echo 'No private keys, signing, transaction or seller. This is a trusted-RPC view, not a code audit or proof of backups.'
            echo '```json'
            cat "$RUNNER_TEMP/v12-circle-preflight.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/v12-circle-preflight.json")),separators=(",",":")); print("::notice title=V12 vault Circle preflight::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
