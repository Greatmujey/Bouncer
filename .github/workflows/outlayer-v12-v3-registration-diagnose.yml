# Read-only diagnosis of the existing original hash and fresh state. No resend.
name: V3 original registration diagnosis (read only)
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  diagnose:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[outlayer-v12-v3-register-diagnose]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/outlayer-v12-burn-registration.test.mjs tests/read-only-near-receipts.test.mjs
      - name: Inspect original hash and next-stage views without sending
        run: |
          set -euo pipefail
          node scripts/diagnose-outlayer-v12-v3-registration.mjs > "$RUNNER_TEMP/registration-diagnosis.json"
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/registration-diagnosis.json")),separators=(",",":")); print("::notice title=Original V12 registration diagnosis::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Original-hash diagnosis only'; echo 'Missing or unavailable RPC data cannot prove the transaction did not happen. Never resend.'; echo '```json'; cat "$RUNNER_TEMP/registration-diagnosis.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
