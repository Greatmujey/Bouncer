# Public testnet views only; no signing, key access or broadcast.
name: Backed-up owner Circle preflight (read only)

on:
  push:
    branches: ['arena/25a7aaf6-near-hub']

permissions:
  contents: read

jobs:
  inspect:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[circle-owner-v3-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install lockfile and test fixed-action safeguards
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/circle-owner-registration.test.mjs tests/circle-owner-registration-runner.test.mjs tests/circle-owner-offline-journal.test.mjs
      - name: Inspect the new owner and actual Circle token at one FINAL block
        run: |
          set -euo pipefail
          if ! node scripts/inspect-circle-owner-v3.mjs > "$RUNNER_TEMP/circle-owner.json" 2> "$RUNNER_TEMP/circle-owner-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/circle-owner-error.log").read()[-3000:]; print("::error title=Read-only Circle preflight unavailable::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## Public Circle testnet owner snapshot'
            echo 'All views share one fresh FINAL block from the selected RPC. The private key and user backup are not checked; no signature, payment, vault deployment or seller contact occurred.'
            echo '```json'
            cat "$RUNNER_TEMP/circle-owner.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; p=os.environ["RUNNER_TEMP"]+"/circle-owner.json"; s=json.dumps(json.load(open(p)),separators=(",",":")); print("::notice title=Public backed-up Circle owner preflight::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
