# Synthetic GitHub permission and uniqueness check only. No live voucher,
# provider contact, owner key or blockchain transaction. The test deletes only
# its own synthetic label; real voucher reservation labels must never be deleted.
name: Check Tollgate cross-run fence permissions
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
  issues: write
jobs:
  synthetic-fence:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[v13-remote-fence-check]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install and exercise synthetic safety tests
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/tollgate-github-voucher-fence.test.mjs tests/tollgate-quakes-v13.test.mjs
      - name: Check GitHub label uniqueness with an unused synthetic key
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! node scripts/test-tollgate-github-fence-live.mjs > "$RUNNER_TEMP/tollgate-fence-smoke.json" 2> "$RUNNER_TEMP/tollgate-fence-smoke-error.txt"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/tollgate-fence-smoke-error.txt").read()[-3500:]; print("::error title=Synthetic voucher-fence check failed::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import json,os; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/tollgate-fence-smoke.json")),separators=(",",":")); print("::notice title=Synthetic GitHub voucher-fence smoke::"+s)'
