# Read-only: the diagnostic injects an always-throw sender, never broadcasts.
name: Diagnose original OutLayer token registration (read only)
on:
  push:
    branches: ['arena/**']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[outlayer-burn-register-diagnose]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Diagnose without sending
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/diagnose-outlayer-burn-registration.mjs > "$RUNNER_TEMP/outlayer-register-diagnosis.json"
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/outlayer-register-diagnosis.json")),separators=(",",":")); print("::notice title=Original registration read-only diagnosis::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Original registration diagnosis'; echo 'No transaction sent. Unknown is not absence; never resend.'; echo '```json'; cat "$RUNNER_TEMP/outlayer-register-diagnosis.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
