# ONE-SHOT TESTNET guard control, distinct from the registration. This is a
# public bearer, no private key is uploaded; never retry either original.
name: Fence uncertain OutLayer registration once
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
  actions: read
jobs:
  control:
    if: github.event.before == '196cac5fa8ba12b55279ba131ea5a99091fed701' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[outlayer-registration-control-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test original binding, guard, receipts and fence
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/outlayer-registration-control.test.mjs tests/outlayer-registration-control-runner.test.mjs tests/outlayer-burn-registration.test.mjs tests/github-original-fence.test.mjs tests/read-only-near-receipts.test.mjs
      - name: Prepare distinct control fence
        id: plan
        run: |
          set -euo pipefail
          file='evidence/testnet-owner-v2/outlayer-burn-register-control-original.json'
          digest="$(sha256sum "$file" | cut -d' ' -f1)"
          echo "sha=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/outlayer-burn-control-fence"
          cp "$file" "$RUNNER_TEMP/outlayer-burn-control-fence/control.json"
          cp 'evidence/testnet-owner-v2/outlayer-burn-register-original.json' "$RUNNER_TEMP/outlayer-burn-control-fence/registration.json"
          printf 'network=testnet\nrun_id=%s\ncommit=%s\ncontrol_sha256=%s\nrequest=one zero-yocto guard control; reconcile both originals, never resend\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$digest" > "$RUNNER_TEMP/outlayer-burn-control-fence/attempt.txt"
      - name: Retain control fence before one send
        id: fence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: outlayer-burn-control-fence-${{ github.run_id }}-${{ steps.plan.outputs.sha }}
          path: ${{ runner.temp }}/outlayer-burn-control-fence/
          retention-days: 30
          if-no-files-found: error
      - name: Recheck state, send one control and verify original guard failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOUNCER_FENCE_ARTIFACT_ID: ${{ steps.fence.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if ! node scripts/broadcast-outlayer-registration-control-once.mjs > "$RUNNER_TEMP/outlayer-control-result.json" 2> "$RUNNER_TEMP/outlayer-control-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/outlayer-control-error.log").read()[-2500:]; print("::error title=Original control unknown; never resend::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/outlayer-control-result.json")),separators=(",",":")); print("::notice title=OutLayer registration nonce control result::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Distinct zero-yocto nonce control'; echo 'An expected guard rejection fences the earlier nonce but does not prove the earlier receipt history. No seller payment or delivery.'; echo '```json'; cat "$RUNNER_TEMP/outlayer-control-result.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
