# Public certificate/hostname check only. No password, database login, wallet
# access or transaction is involved.
name: Verify testnet database pooler TLS
on:
  push:
    branches: ['arena/0e4386ea-near-hub']
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[phone-ca-test]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify public pooler certificates and hostnames
        run: node bouncer/scripts/test-supabase-pooler-tls.mjs
