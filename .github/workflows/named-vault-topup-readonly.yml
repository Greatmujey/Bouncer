# Fixed public testnet views only; never signs or transfers.
name: Named account vault topup preflight (read only)

on:
  push:
    branches: ['arena/**']

permissions:
  contents: read

jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[named-vault-topup-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test fixed action and view guards
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/named-vault-topup.test.mjs tests/named-testnet-recovery.test.mjs
      - name: Inspect the exact source and keyless vault
        run: |
          set -euo pipefail
          node scripts/inspect-named-vault-topup.mjs > "$RUNNER_TEMP/named-topup.json"
          {
            echo '## Read-only testnet topup snapshot'
            echo 'Fresh pinned views and approximate gas/storage headroom; no signature, transfer, seller or fulfillment.'
            echo '```json'
            cat "$RUNNER_TEMP/named-topup.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; d=json.load(open(os.environ["RUNNER_TEMP"]+"/named-topup.json")); s=json.dumps(d,separators=(",",":")); assert len(s)<3500; print("::notice title=Named vault topup preflight::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
