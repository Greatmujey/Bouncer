# Read-only V3-owner preflight for the fixed experimental V12 artifact.
name: Backed-up owner V12 vault preflight (read only)
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  inspect:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[keyless-vault-v12-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Retrieve the matching public V12 artifact for offline tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Greatmujey/Bouncer/git/blobs/16785505eaed13609d8e569e7b1665f89683d9eb --jq .content | base64 -d > "$RUNNER_TEMP/v12-testnet.wasm"
          printf '%s  %s\n' '033f255c5822ff97495809f7d60fddf66f266f20c36285fe71296b66decc6d12' "$RUNNER_TEMP/v12-testnet.wasm" | sha256sum -c -
          test "$(wc -c < "$RUNNER_TEMP/v12-testnet.wasm")" -eq 536651
      - name: Test V12 pinned setup and original-hash guards
        env:
          BOUNCER_V12_WASM: ${{ runner.temp }}/v12-testnet.wasm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/keyless-vault-v12*.test.mjs tests/circle-owner-acquisition*.test.mjs tests/read-only-near-receipts.test.mjs
      - name: Inspect the V3 direct-child and protocol without signing
        run: |
          set -euo pipefail
          if ! node scripts/inspect-keyless-vault-v12.mjs > "$RUNNER_TEMP/v12-preflight.json" 2> "$RUNNER_TEMP/v12-preflight-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/v12-preflight-error.log").read()[-3000:]; print("::error title=V12 vault preflight blocked or unavailable::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            test ! -s "$RUNNER_TEMP/v12-preflight.json" || python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/v12-preflight.json")),separators=(",",":")); print("::notice title=V12 vault preflight::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/v12-preflight.json")),separators=(",",":")); print("::notice title=V12 vault preflight::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Experimental V12 vault preflight'; echo 'No keys, signatures, transactions or seller calls. Storage stake can remain locked; this is not an audit or runtime guarantee.'; echo '```json'; cat "$RUNNER_TEMP/v12-preflight.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
