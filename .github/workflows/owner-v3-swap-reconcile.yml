# Read-only original-hash recovery; never signs or sends.
name: Reconcile backed-up owner swap (read only)
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    if: contains(github.event.head_commit.message, '[owner-v3-swap-reconcile]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test original receipt and read-only guards
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/circle-owner-acquisition*.test.mjs tests/read-only-near-receipts.test.mjs tests/github-original-fence.test.mjs
      - name: Verify the fixed original and fresh state, without sending
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! node scripts/reconcile-owner-v3-swap.mjs > "$RUNNER_TEMP/swap-reconcile.json" 2> "$RUNNER_TEMP/swap-reconcile-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/swap-reconcile-error.log").read()[-2500:]; print("::error title=Original swap unresolved; never resend::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/swap-reconcile.json")),separators=(",",":")); print("::notice title=Backed-up owner swap reconciliation::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Original testnet swap reconciliation'; echo 'Read-only lookup: no signing, replacement or broadcast.'; echo '```json'; cat "$RUNNER_TEMP/swap-reconcile.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
