# Read-only comparison only: no seller endpoint, wallet, secret or chain send.
name: Compare Buffer testnet code with pinned source build

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[buffer-code-compare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked dependencies and test offline comparisons
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/buffer-code-comparison.test.mjs
      - name: Recover exact public source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buffer-src/src"
          fetch_blob() {
            local blob="$1" target="$2"
            gh api "repos/Chima30/buffer/git/blobs/$blob" --jq .content | base64 --decode > "$target"
            test "$(git hash-object "$target")" = "$blob"
          }
          # Chima30/buffer@9bc5ef0cbdc84074e94995cb50d334fc615f9b96.
          fetch_blob 34a9011cc085c1115cc6584fc307693129cf96a6 "$RUNNER_TEMP/buffer-src/Cargo.toml"
          fetch_blob cfbbac93dc23c381e129ba75af45a0613fb948bb "$RUNNER_TEMP/buffer-src/Cargo.lock"
          fetch_blob f13f8304470aea083e2ba45e16209ac681085e84 "$RUNNER_TEMP/buffer-src/rust-toolchain.toml"
          fetch_blob 45b4444f00245fbde226a55a8e32aa5221c20753 "$RUNNER_TEMP/buffer-src/src/lib.rs"
          fetch_blob c6e2cf36ff32e9dbfc93d75ab57f230b72f68475 "$RUNNER_TEMP/buffer-src/src/evm.rs"
          fetch_blob e670a466244fe0d6fab3abf2a2b8ac04c82216e9 "$RUNNER_TEMP/buffer-src/src/tests.rs"
      - name: Build the pinned public source without owner credentials
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
          # This build is not assumed reproducible; a mismatch is reported as a
          # mismatch, not proof of malicious code. Build scripts are untrusted.
          if ! RUSTFLAGS='--cfg near -C link-arg=-s' cargo +1.93.0 build --locked --release --target wasm32-unknown-unknown --lib \
              --manifest-path "$RUNNER_TEMP/buffer-src/Cargo.toml" > "$RUNNER_TEMP/buffer-build.log" 2>&1; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/buffer-build.log").read()[-5000:]; print("::error title=Buffer comparison build failed::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
      - name: Compare to one fresh public testnet FINAL block
        run: |
          set -euo pipefail
          node scripts/inspect-buffer-code.mjs --wasm "$RUNNER_TEMP/buffer-src/target/wasm32-unknown-unknown/release/buffer_desk.wasm" > "$RUNNER_TEMP/buffer-code.json"
          RESULT="$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))))' "$RUNNER_TEMP/buffer-code.json")"
          echo "::notice title=Buffer read-only bytecode comparison::$RESULT"
          {
            echo '## Buffer testnet code comparison'
            echo 'One local source build compared with one trusted-RPC FINAL account code hash. No seller endpoint, transaction, delivery or audit.'
            echo '```json'
            cat "$RUNNER_TEMP/buffer-code.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
