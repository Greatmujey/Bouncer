# Read-only lookup of a new original registration and its prior control.
name: Reconcile registration after nonce control (read only)
on:
  push:
    branches: ['arena/**']
permissions:
  contents: read
jobs:
  reconcile:
    if: contains(github.event.head_commit.message, '[outlayer-after-control-reconcile]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/outlayer-registration-after-control.test.mjs tests/read-only-near-receipts.test.mjs
      - name: Verify both original hashes
        run: |
          set -euo pipefail
          if ! node scripts/reconcile-outlayer-after-control.mjs > "$RUNNER_TEMP/outlayer-new-registration.json" 2> "$RUNNER_TEMP/outlayer-new-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/outlayer-new-error.log").read()[-2500:]; print("::error title=New registration unknown; never resend::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/outlayer-new-registration.json")),separators=(",",":")); print("::notice title=OutLayer registration after control reconciliation::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Read-only new registration reconciliation'; echo 'No transaction or seller payment. The earlier registration receipt may remain unknown.'; echo '```json'; cat "$RUNNER_TEMP/outlayer-new-registration.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
