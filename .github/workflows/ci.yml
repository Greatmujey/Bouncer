name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + wasm target
        run: |
          rustup update stable --no-self-update
          rustup target add wasm32-unknown-unknown
          rustc --version && cargo --version
      - name: Build wasm (debug) — log all output
        working-directory: bouncer/contracts/bouncer
        run: |
          set +e
          cargo build --target wasm32-unknown-unknown 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
      - name: Copy wasm to artifact dir
        if: success()
        run: |
          mkdir -p bouncer/contracts/bouncer/res
          cp bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm bouncer/contracts/bouncer/res/bouncer.wasm
          ls -la bouncer/contracts/bouncer/res/bouncer.wasm
          echo "wasm size: $(wc -c < bouncer/contracts/bouncer/res/bouncer.wasm) bytes"
      - name: Upload wasm
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bouncer-wasm
          path: bouncer/contracts/bouncer/res/bouncer.wasm
