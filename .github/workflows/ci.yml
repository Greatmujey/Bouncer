  dependent-historical-verification:
    name: Verify dependent workflow with installed seller SDK (read only)
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[provider-inspect]') || contains(github.event.head_commit.message, '[seller-sdk-check]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      # Install the exact local tarball in a separate seller application. This
      # job only reads existing transactions; it has no key and cannot pay.
      - name: Pack and install the private testnet SDK locally
        shell: bash
        run: |
          set -euo pipefail
          archive=$(npm pack ./bouncer/packages/provider-sdk --pack-destination "$RUNNER_TEMP" --silent)
          test "$archive" = 'bouncer-near-testnet-provider-sdk-0.3.0.tgz'
          mkdir -p "$RUNNER_TEMP/seller-client"
          printf '{"name":"seller-check","version":"1.0.0","private":true,"type":"module"}\n' > "$RUNNER_TEMP/seller-client/package.json"
          npm install --prefix "$RUNNER_TEMP/seller-client" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/$archive"
          echo "BOUNCER_SELLER_SDK_MODULE=$RUNNER_TEMP/seller-client/node_modules/bouncer-near-testnet-provider-sdk/index.mjs" >> "$GITHUB_ENV"
      - name: Check installed seller-v2 memo vector offline
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { pathToFileURL } from 'node:url';
          const sdk = await import(pathToFileURL(process.env.BOUNCER_SELLER_SDK_MODULE).href);
          const input = { text: 'same work', rounds: 2 }, challenge = '00112233445566778899aabbccddeeff';
          const expected = 'bouncer-order-v2:compute:00112233445566778899aabbccddeeff:88425334a4bb614fc54e3425a4d9cb3203fa9b4548ac732e006fd3d53d315fc5';
          if (sdk.orderMemoV2('compute', input, challenge) !== expected || sdk.challengeFromOrderMemo('compute', input, expected) !== challenge) throw new Error('installed seller-v2 vector mismatch');
          console.log('Installed SDK seller-v2 vector verified offline; no quote or payment.');
          NODE
      - name: Verify seller-v2 source, receipts and substitutions without paying
        run: node bouncer/scripts/verify-seller-v2-history.mjs
      - name: Verify the existing legacy source and seller receipts without paying
        run: node bouncer/scripts/verify-dependent-history.mjs

