name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build & find wasm
        run: |
          set -x
          cd bouncer/contracts/bouncer
          pwd
          ls
          RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown -v 2>&1 | tee /tmp/build.log | tail -200
          echo "=== FIND WASM ==="
          find /home/runner -name "*.wasm" 2>&1 | head -30
          ls target/ 2>&1 || true
          ls target/wasm32-unknown-unknown/ 2>&1 || true
          ls target/wasm32-unknown-unknown/debug/ 2>&1 || true
          mkdir -p /home/runner/work/_dist
          find /home/runner -name "bouncer.wasm" | head -1 | xargs -I{} cp {} /home/runner/work/_dist/bouncer.wasm
          ls -la /home/runner/work/_dist/
          wc -c /home/runner/work/_dist/bouncer.wasm || echo "NO WASM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bouncer-wasm
          path: /home/runner/work/_dist/bouncer.wasm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
