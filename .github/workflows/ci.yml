      # execution; intentionally corrupted local evidence is recovered by hash.
      - name: Execute under Bouncer policy and verify independent delivery
        shell: bash
        run: |
          set +e
          node bouncer/demo-outlayer.mjs 2>&1 | tee "$RUNNER_TEMP/outlayer-live.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Guarded OutLayer live check failed::"+s)' "$RUNNER_TEMP/outlayer-live.log"
          fi
