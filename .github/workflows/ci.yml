name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build in repo dir
        working-directory: repo/bouncer/contracts/bouncer
        run: |
          RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown -v 2>&1 | tail -200
          ls target/wasm32-unknown-unknown/debug/ | head -30
          cp target/wasm32-unknown-unknown/debug/bouncer.wasm /home/runner/bouncer.wasm
      - name: List root & commit wasm
        working-directory: repo
        run: |
          ls -la /home/runner/bouncer.wasm
          wc -c /home/runner/bouncer.wasm
          cp /home/runner/bouncer.wasm ./bouncer.wasm
          ls -la ./bouncer.wasm
          git config user.name "CI Bot"
          git config user.email "ci@bouncer.local"
          git add bouncer.wasm -f
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): attach bouncer.wasm"
            git push
          else
            echo "no change"
          fi
