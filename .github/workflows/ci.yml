name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build
        run: |
          cd bouncer/contracts/bouncer
          ls
          # Plain build, no tail; capture full exit code
          RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown
          echo "=== listing target ==="
          ls target/wasm32-unknown-unknown/debug/ | head -40
          cp target/wasm32-unknown-unknown/debug/bouncer.wasm ../../../bouncer.wasm
          cd ../../..
          ls -la bouncer.wasm
          wc -c bouncer.wasm
      - name: Commit wasm back to branch
        run: |
          git config user.name "CI Bot"
          git config user.email "ci@bouncer.local"
          git add bouncer.wasm -f
          if git diff --cached --quiet; then
            echo "No change to bouncer.wasm"
          else
            git commit -m "chore(ci): attach bouncer.wasm build artifact"
            git push
          fi
