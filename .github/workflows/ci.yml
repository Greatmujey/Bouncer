      - name: Request the new disposable testnet owner once
        run: node bouncer/scripts/native-testnet-qa.mjs faucet '${{ steps.boot_artifact.outputs.artifact-id }}'
      - name: Prepare creation original without broadcasting
        id: stage0
        run: node bouncer/scripts/native-testnet-qa.mjs prepare-stage 0
      - name: Retain creation original before sending
        id: stage0_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage0.outputs.artifact_name }}
          path: ${{ steps.stage0.outputs.artifact_file }}
          if-no-files-found: error
          retention-days: 90
      - name: Send creation original once and verify FINAL
        run: node bouncer/scripts/native-testnet-qa.mjs send-stage 0 '${{ steps.stage0_artifact.outputs.artifact-id }}'
      - name: Prepare policy original without broadcasting
        id: stage1
        run: node bouncer/scripts/native-testnet-qa.mjs prepare-stage 1
      - name: Retain policy original before sending
        id: stage1_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage1.outputs.artifact_name }}
          path: ${{ steps.stage1.outputs.artifact_file }}
          if-no-files-found: error
          retention-days: 90
      - name: Send policy original once and verify FINAL
        run: node bouncer/scripts/native-testnet-qa.mjs send-stage 1 '${{ steps.stage1_artifact.outputs.artifact-id }}'
      - name: Prepare funding original without broadcasting
        id: stage2
        run: node bouncer/scripts/native-testnet-qa.mjs prepare-stage 2
      - name: Retain funding original before sending
        id: stage2_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage2.outputs.artifact_name }}
          path: ${{ steps.stage2.outputs.artifact_file }}
          if-no-files-found: error
          retention-days: 90
      - name: Send funding original once and verify FINAL
        run: node bouncer/scripts/native-testnet-qa.mjs send-stage 2 '${{ steps.stage2_artifact.outputs.artifact-id }}'
      - name: Prepare agent-key original without broadcasting
        id: stage3
        run: node bouncer/scripts/native-testnet-qa.mjs prepare-stage 3
      - name: Retain agent-key original before sending
        id: stage3_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage3.outputs.artifact_name }}
          path: ${{ steps.stage3.outputs.artifact_file }}
          if-no-files-found: error
          retention-days: 90
      - name: Send agent-key original once and verify FINAL
        run: node bouncer/scripts/native-testnet-qa.mjs send-stage 3 '${{ steps.stage3_artifact.outputs.artifact-id }}'
      - name: Prepare a single guarded OutLayer original without broadcasting
        id: trial
        run: node bouncer/scripts/native-testnet-qa.mjs prepare-trial
      - name: Retain the guarded trial original before sending
        id: trial_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.trial.outputs.artifact_name }}
          path: ${{ steps.trial.outputs.artifact_file }}
          if-no-files-found: error
          retention-days: 90
      - name: Send the guarded trial once and verify provider receipts
        run: node bouncer/scripts/native-testnet-qa.mjs send-trial '${{ steps.trial_artifact.outputs.artifact-id }}'
      - name: Preserve only public verified result summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-qa-${{ github.run_id }}-public-results
          path: ${{ runner.temp }}/bouncer-native-qa/public/*-result.json
          if-no-files-found: ignore
          retention-days: 90

  testnet-smoke:
    name: Live testnet restricted-key smoke test
    if: github.event.repository.private == true && github.run_attempt == '1' && ((github.event_name == 'workflow_dispatch' && inputs.run_testnet_smoke == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testnet-smoke]')))
    needs: build-contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bouncer-wasm
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      # Keys live only on this ephemeral runner and are never uploaded.
      - run: node bouncer/demo-all.mjs

  testnet-multi:
    name: Live testnet multi-token procurement check
    if: github.event.repository.private == true && github.run_attempt == '1' && github.event_name == 'push' && (contains(github.event.head_commit.message, '[multi-resource-smoke]') || contains(github.event.head_commit.message, '[provider-compare]') || contains(github.event.head_commit.message, '[delivery-verify]') || contains(github.event.head_commit.message, '[separate-owner]') || contains(github.event.head_commit.message, '[mixed-outlayer]'))
    needs: build-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bouncer-wasm
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      # Uses the NEAR testnet token factory; only synthetic testnet FTs.
      # The optional comparison uses two self-hosted development providers.
      # Keys and journal stay on the ephemeral runner; nothing is uploaded.
      - name: Run testnet multi-resource and optional provider comparison
        shell: bash
        env:
          BOUNCER_DEMO_COMPARE: ${{ (contains(github.event.head_commit.message, '[provider-compare]') || contains(github.event.head_commit.message, '[delivery-verify]')) && '1' || '0' }}
          BOUNCER_DEMO_BAD_DELIVERY: ${{ contains(github.event.head_commit.message, '[delivery-verify]') && '1' || '0' }}
          BOUNCER_DEMO_SEPARATE_OWNER: ${{ (contains(github.event.head_commit.message, '[separate-owner]') || contains(github.event.head_commit.message, '[mixed-outlayer]')) && '1' || '0' }}
          BOUNCER_DEMO_OUTLAYER: ${{ contains(github.event.head_commit.message, '[mixed-outlayer]') && '1' || '0' }}
        run: |
          set +e
          node bouncer/demo-multi-resource.mjs 2>&1 | tee "$RUNNER_TEMP/multi-resource.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Multi-resource check failed::"+s)' "$RUNNER_TEMP/multi-resource.log"
          fi
          exit "$result"
      - name: Preserve unresolved synthetic testnet journal
        if: failure() && contains(github.event.head_commit.message, '[mixed-outlayer]')
        uses: actions/upload-artifact@v4
        with:
          name: mixed-testnet-unresolved-journal
          path: ~/.bouncer/testnet/*.bouncer-journal.json
          if-no-files-found: ignore
          retention-days: 14

  ai-testnet:
    name: Local AI-planned multi-resource testnet flow
    if: github.event.repository.private == true && github.run_attempt == '1' && github.event_name == 'push' && (contains(github.event.head_commit.message, '[ai-multi-resource]') || contains(github.event.head_commit.message, '[ai-provider-compare]') || contains(github.event.head_commit.message, '[ai-delivery-verify]'))
    needs: build-contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bouncer-wasm
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      - name: Prepare pinned local model with the user bootstrap script
        shell: bash
        env:
          BOUNCER_MODEL_CACHE: ${{ runner.temp }}/bouncer-local-model
        run: |
          set +e
          bash bouncer/scripts/local-model.sh --prepare 2>&1 | tee "$RUNNER_TEMP/ai-download.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-2500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Model download failed::"+s)' "$RUNNER_TEMP/ai-download.log"
          fi
          exit "$result"
      - name: Plan with the local model, then pay and fulfill on NEAR testnet
        shell: bash
        env:
          BOUNCER_DEMO_AI: '1'
          BOUNCER_DEMO_PUBLIC_DATA: '1'
          BOUNCER_DEMO_COMPARE: ${{ (contains(github.event.head_commit.message, '[ai-provider-compare]') || contains(github.event.head_commit.message, '[ai-delivery-verify]')) && '1' || '0' }}
          BOUNCER_DEMO_BAD_DELIVERY: ${{ contains(github.event.head_commit.message, '[ai-delivery-verify]') && '1' || '0' }}
          BOUNCER_DEMO_SEPARATE_OWNER: ${{ (contains(github.event.head_commit.message, '[separate-owner]') || contains(github.event.head_commit.message, '[mixed-outlayer]')) && '1' || '0' }}
          BOUNCER_DEMO_OUTLAYER: ${{ contains(github.event.head_commit.message, '[mixed-outlayer]') && '1' || '0' }}
          BOUNCER_LLM_URL: http://127.0.0.1:17890/v1/chat/completions
          BOUNCER_LLM_MODEL: bouncer-local-qwen
          BOUNCER_MODEL_CACHE: ${{ runner.temp }}/bouncer-local-model
        run: |
          set -euo pipefail
          bash bouncer/scripts/local-model.sh > "$RUNNER_TEMP/llama-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! curl -fsS --retry 45 --retry-delay 2 --retry-connrefused 'http://127.0.0.1:17890/health'; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Local model server failed::"+s)' "$RUNNER_TEMP/llama-server.log"
            exit 1
          fi
          set +e
          node bouncer/demo-multi-resource.mjs 2>&1 | tee "$RUNNER_TEMP/ai-testnet.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=AI testnet check failed::"+s)' "$RUNNER_TEMP/ai-testnet.log"
          fi
          exit "$result"
      - name: Preserve unresolved synthetic AI testnet journal
        if: failure() && contains(github.event.head_commit.message, '[mixed-outlayer]')
        uses: actions/upload-artifact@v4
        with:
          name: ai-mixed-testnet-unresolved-journal
          path: ~/.bouncer/testnet/*.bouncer-journal.json
          if-no-files-found: ignore
          retention-days: 14

  wallet-probe:
    name: External Meteor testnet page probe (no sign-in)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[wallet-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe the real wallet UI without credentials or signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOUNCER_PLAYWRIGHT_PATH: ${{ runner.temp }}/bouncer-browser/node_modules/playwright-core/index.mjs
          BOUNCER_METEOR_EXECUTOR: ${{ runner.temp }}/meteor-executor.js
          BOUNCER_WALLET_PROBE_ORIGIN: https://bouncer-near.vercel.app/
        run: |
          npm install --prefix "$RUNNER_TEMP/bouncer-browser" --no-save --no-audit --no-fund playwright-core@1.64.1
          gh api repos/Meteor-Wallet/meteor_wallet_sdk/git/blobs/b76fb93ff5d47064845d09313173b6eddbfa64e3 --jq .content | base64 -d > "$BOUNCER_METEOR_EXECUTOR"
          set +e
          node bouncer/scripts/probe-meteor-login.mjs 2>&1 | tee "$RUNNER_TEMP/wallet-probe.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-2500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Wallet UI probe failed::"+s)' "$RUNNER_TEMP/wallet-probe.log"
          fi
          exit "$result"

  mcp-clients:
    name: Real AI-client MCP handshake smoke
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[mcp-clients]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      - name: Install pinned CLI clients in disposable runner storage
        run: npm install --prefix "$RUNNER_TEMP/bouncer-clients" --no-save --no-audit --no-fund @google/gemini-cli@0.65.0 @anthropic-ai/claude-code@2.1.311
      - name: Verify Claude Code and Gemini CLI stdio connection (no account or inference)
        shell: bash
        env:
          BOUNCER_GEMINI_BIN: ${{ runner.temp }}/bouncer-clients/node_modules/.bin/gemini
          BOUNCER_CLAUDE_BIN: ${{ runner.temp }}/bouncer-clients/node_modules/.bin/claude
        run: |
          set +e
          node bouncer/scripts/test-mcp-clients.mjs 2>&1 | tee "$RUNNER_TEMP/mcp-clients.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-2500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=MCP client check failed::"+s)' "$RUNNER_TEMP/mcp-clients.log"
          fi
          exit "$result"

  mcp-testnet:
    name: Live read-only MCP policy and quote checks
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[mcp-testnet]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      - name: Inspect and preview three resources via MCP and testnet RPC
        shell: bash
        run: |
          set +e
          node bouncer/scripts/test-mcp-testnet.mjs 2>&1 | tee "$RUNNER_TEMP/mcp-testnet.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-2500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Live MCP check failed::"+s)' "$RUNNER_TEMP/mcp-testnet.log"
          fi
          exit "$result"
