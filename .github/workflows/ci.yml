name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + wasm target
        run: |
          rustup update stable --no-self-update
          rustup target add wasm32-unknown-unknown
          rustc --version && cargo --version
      - name: cargo check (wasm target) — print full errors
        working-directory: bouncer/contracts/bouncer
        run: cargo check --target wasm32-unknown-unknown --message-format=short 2>&1 | tail -80
        continue-on-error: true
      - name: Build wasm (release, opt-level=z)
        working-directory: bouncer/contracts/bouncer
        run: RUSTFLAGS="-C link-arg=-s" cargo build --release --target wasm32-unknown-unknown
      - name: Copy wasm to artifact dir
        run: |
          mkdir -p bouncer/contracts/bouncer/res
          cp bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm bouncer/contracts/bouncer/res/bouncer.wasm
          ls -la bouncer/contracts/bouncer/res/bouncer.wasm
          echo "wasm size: $(wc -c < bouncer/contracts/bouncer/res/bouncer.wasm) bytes"
      - name: Upload wasm as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bouncer-wasm
          path: bouncer/contracts/bouncer/res/bouncer.wasm
