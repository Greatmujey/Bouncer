name: Build & Test Bouncer

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
    inputs:
      run_testnet_smoke:
        description: 'Approve fresh testnet account creation, deployment and token transfers (not mainnet)'
        required: false
        default: false
        type: boolean

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Ephemeral test database; no testnet credentials or paid calls.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bouncer
          POSTGRES_PASSWORD: bouncer-ci-only
          POSTGRES_DB: bouncer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bouncer -d bouncer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix walletconnect --ignore-scripts --no-audit --no-fund
      # Fail quickly on browser or asset regressions before the broader suite.
      - name: Rebuild and verify wallet, WalletConnect and Google website assets
        shell: bash
        run: |
          npm run build:web
          python3 scripts/build-intear-source.py
          ./node_modules/.bin/esbuild web-src/vendor/intear/web/src/js/near-selector.js --bundle --format=esm --target=es2020 --minify --define:__NEARCONNECT__=true --outfile="$RUNNER_TEMP/intear-rebuilt.js"
          cmp web/intear-wallet.executor.js "$RUNNER_TEMP/intear-rebuilt.js"
          git diff --exit-code -- web/wallet.bundle.js web/walletconnect.bundle.js web/walletconnect-NOTICES.txt web/api/wc-relay.mjs web/intear-wallet-source.zip web/ethereum-wallet.executor.js web/ethereum-wallet-NOTICE.txt
      - name: Test onboarding, wallet picker and Google identity UI
        env:
          BOUNCER_PLAYWRIGHT_PATH: ${{ runner.temp }}/bouncer-browser/node_modules/playwright-core/index.mjs
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/bouncer-browser" --no-save --no-audit --no-fund playwright-core@1.64.1
          for script in test-web-browser.mjs test-witnessed-setup-browser.mjs test-buffer-private-order-browser.mjs \
            test-walletconnect-browser.mjs test-wallet-prompt-fence-browser.mjs test-native-oracle-device-key-browser.mjs \
            test-native-oracle-setup-browser.mjs test-witnessed-native-oracle-phone-browser.mjs \
            test-native-oracle-owner-ui-browser.mjs; do
            set +e
            node "scripts/$script" 2>&1 | tee "$RUNNER_TEMP/browser-test.log"
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -ne 0 ]; then
              node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-5000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Browser test failed::"+s)' "$RUNNER_TEMP/browser-test.log"
              exit "$result"
            fi
          done
      - name: Test pinned wallet adapters with synthetic signers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOUNCER_PLAYWRIGHT_PATH: ${{ runner.temp }}/bouncer-browser/node_modules/playwright-core/index.mjs
          BOUNCER_METEOR_EXECUTOR: ${{ runner.temp }}/meteor-executor.js
          BOUNCER_CLI_EXECUTOR: ${{ runner.temp }}/cli-executor.js
          BOUNCER_MOBILE_EXECUTOR: ${{ runner.temp }}/mobile-executor.js
          BOUNCER_NIGHTLY_EXECUTOR: ${{ runner.temp }}/nightly-executor.js
          BOUNCER_LEDGER_EXECUTOR: ${{ runner.temp }}/ledger-executor.js
        run: |
          set +e
          (
            set -e -o pipefail
            gh api repos/Meteor-Wallet/meteor_wallet_sdk/git/blobs/b76fb93ff5d47064845d09313173b6eddbfa64e3 --jq .content | base64 -d > "$BOUNCER_METEOR_EXECUTOR"
            gh api repos/near/near-cli-connect/git/blobs/32f1a33250370b5250a72d68ce24459628069fd7 --jq .content | base64 -d > "$BOUNCER_CLI_EXECUTOR"
            gh api repos/fastnear/near-connect/git/blobs/19a9d9513c6a240e1fe228b820b9aebccbf66dcd --jq .content | base64 -d > "$BOUNCER_MOBILE_EXECUTOR"
            gh api repos/hot-dao/near-selector/git/blobs/4a683d0d14abd97e163fbcc539a98949a7f79f86 --jq .content | base64 -d > "$BOUNCER_NIGHTLY_EXECUTOR"
            gh api repos/near/near-connect-ledger/git/blobs/0e735ec1243811bd38a7a2af359b2f19c07be282 --jq .content | base64 -d > "$BOUNCER_LEDGER_EXECUTOR"
            node scripts/test-wallet-adapters.mjs
          ) 2>&1 | tee "$RUNNER_TEMP/wallet-adapters.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-6000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Wallet adapter tests failed::"+s)' "$RUNNER_TEMP/wallet-adapters.log"
          fi
          exit "$result"

      # Isolated, lockfile-pinned third-party seller SDK. Its NEAR driver is
      # wrapped only in tests because the published preset is mainnet-only.
      - run: npm ci --prefix interop/piprail --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Recover exact public V12 test fixture
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Greatmujey/Bouncer/git/blobs/16785505eaed13609d8e569e7b1665f89683d9eb --jq .content | base64 --decode > "$RUNNER_TEMP/bouncer-v12.wasm"
          echo '033f255c5822ff97495809f7d60fddf66f266f20c36285fe71296b66decc6d12  '"$RUNNER_TEMP/bouncer-v12.wasm" | sha256sum -c -
          echo "BOUNCER_V12_WASM_PATH=$RUNNER_TEMP/bouncer-v12.wasm" >> "$GITHUB_ENV"
      - name: Run JavaScript test suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/bouncer-js-tests.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8");const lines=s.split("\n");const failed=[];for(let i=0;i<lines.length;i++)if(/^not ok\b/.test(lines[i]))failed.push(lines.slice(i,i+24).join("\n"));const text=(failed.join("\n---\n")||s.slice(-4000)).slice(0,7500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=JavaScript tests failed::"+text)' "$RUNNER_TEMP/bouncer-js-tests.log"
          fi
          exit "$result"
        env:
          BOUNCER_PIPRAIL_PACKAGE_ROOT: ${{ github.workspace }}/bouncer/interop/piprail/node_modules/@piprail/sdk
      # Some integration tests deliberately disable DB guards. Run the DB files
      # serially so that other tests cannot observe that temporary sabotage.
      - name: Run PostgreSQL integration tests without cross-file guard races
        shell: bash
        env:
          BOUNCER_TEST_POSTGRES_URL: postgresql://bouncer:bouncer-ci-only@127.0.0.1:5432/bouncer_test
          BOUNCER_REQUIRE_POSTGRES_TESTS: '1'
        run: |
          set +e
          npm run test:postgres 2>&1 | tee "$RUNNER_TEMP/bouncer-postgres-tests.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8");const lines=s.split("\n");const failed=[];for(let i=0;i<lines.length;i++)if(/^not ok\b/.test(lines[i]))failed.push(lines.slice(i,i+24).join("\n"));const text=(failed.join("\n---\n")||s.slice(-4000)).slice(0,7500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=PostgreSQL tests failed::"+text)' "$RUNNER_TEMP/bouncer-postgres-tests.log"
          fi
          exit "$result"
      - name: Test offline V11 artifact transport and static inspection
        # Python tests use synthetic data; the exact-artifact case skips unless
        # its local inputs are explicitly supplied. No chain or seller access.
        run: python3 -m unittest discover -s tests -p 'v11*_test.py'

  contract-tests:
    name: Rust contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test policy, authorization and refund logic
        working-directory: bouncer/contracts/bouncer
        shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never CARGO_PROFILE_DEV_DEBUG=0 cargo test --lib 2>&1 | tee "$RUNNER_TEMP/rust-test.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Rust tests failed::"+s)' "$RUNNER_TEMP/rust-test.log"
          fi
          exit "$result"
      - name: Test separate testnet playback-grant variant
        working-directory: bouncer/contracts/bouncer
        shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never CARGO_PROFILE_DEV_DEBUG=0 cargo test --lib --features youtick-playback-v10 2>&1 | tee "$RUNNER_TEMP/rust-playback-tests.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Playback variant tests failed::"+s)' "$RUNNER_TEMP/rust-playback-tests.log"
          fi
          exit "$result"

      - name: Test separate one-shot exact FT intent variant
        working-directory: bouncer/contracts/bouncer
        shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never CARGO_PROFILE_DEV_DEBUG=0 cargo test --lib --features exact-ft-v11 2>&1 | tee "$RUNNER_TEMP/rust-exact-ft-tests.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Exact FT variant tests failed::"+s)' "$RUNNER_TEMP/rust-exact-ft-tests.log"
          fi
          exit "$result"

      - name: Test separate V12 prepaid pair-lock hardening
        working-directory: bouncer/contracts/bouncer
        shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never CARGO_PROFILE_DEV_DEBUG=0 cargo test --lib --features exact-ft-v12 2>&1 | tee "$RUNNER_TEMP/rust-v12-tests.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=V12 pair-lock tests failed::"+s)' "$RUNNER_TEMP/rust-v12-tests.log"
          fi
          exit "$result"

  outlayer-vrf-read:
    name: Discover pinned testnet VRF probe terms (read only)
    if: github.event_name == 'push' && github.run_attempt == '1' && contains(github.event.head_commit.message, '[vrf-capability-read]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      - name: Read public key and registry, without execution or payment
        run: node bouncer/scripts/probe-outlayer-vrf.mjs

  outlayer-vrf2-read:
    name: Check VRF2 provider and test-token readiness (read only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/d00d7f93-near-hub' && github.run_attempt == '1' && contains(github.event.head_commit.message, '[vrf2-capability-read]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      - name: Read provider terms, storage prices and Ref quotes without account creation or payment
        run: node bouncer/scripts/probe-vrf2-ready.mjs

  ref-graph-read:
    name: Inspect existing public Ref and vault receipt graphs (read only)
    if: github.event_name == 'push' && github.run_attempt == '1' && contains(github.event.head_commit.message, '[ref-graph-read]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      - name: Inspect two pinned historical transactions, without keys or sends
        run: node bouncer/scripts/inspect-ref-receipts.mjs
        env:
          NEAR_TESTNET_RPC: https://archival-rpc.testnet.near.org

  ref-router-contract:
    name: Test and build one-shot Ref testnet router
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test routing, refund and owner guards
        working-directory: bouncer/contracts/ref-router
        shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never CARGO_PROFILE_DEV_DEBUG=0 cargo test --lib 2>&1 | tee "$RUNNER_TEMP/ref-router-tests.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Ref router tests failed::"+s)' "$RUNNER_TEMP/ref-router-tests.log"
          fi
          exit "$result"
      - name: Build testnet router WASM
        working-directory: bouncer/contracts/ref-router
        run: RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown --release
      - name: Save router for optional testnet proof
        uses: actions/upload-artifact@v4
        with:
          name: ref-router-wasm
          path: bouncer/contracts/ref-router/target/wasm32-unknown-unknown/release/bouncer_ref_router.wasm
          if-no-files-found: error
      - name: Test separately bounded funding V2
        working-directory: bouncer/contracts/ref-router
        shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never CARGO_PROFILE_DEV_DEBUG=0 cargo test --lib --features funding-v2 2>&1 | tee "$RUNNER_TEMP/ref-router-v2-tests.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Ref router V2 tests failed::"+s)' "$RUNNER_TEMP/ref-router-v2-tests.log"
          fi
          exit "$result"
      - name: Build separate testnet funding V2 WASM
        working-directory: bouncer/contracts/ref-router
        run: RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown --release --features funding-v2
      - name: Save the non-deployed V2 artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: ref-router-funding-v2-wasm
          path: bouncer/contracts/ref-router/target/wasm32-unknown-unknown/release/bouncer_ref_router.wasm
          if-no-files-found: error

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install binaryen
        run: sudo apt-get update -qq && sudo apt-get install -y binaryen
      - name: Cargo check and build wasm
        working-directory: bouncer/contracts/bouncer
        shell: bash
        run: |
          set +e
          (cargo check --target wasm32-unknown-unknown && RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown --release) 2>&1 | tee "$RUNNER_TEMP/wasm-build.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Wasm build failed::"+s)' "$RUNNER_TEMP/wasm-build.log"
          fi
          exit "$result"
      - name: Optimize wasm
        run: |
          set -e
          cp bouncer/contracts/bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm ./bouncer.wasm
          # -Os can strip panic messages; -O1 keeps errors readable.
          wasm-opt -O1 --strip-debug -o bouncer.opt.wasm bouncer.wasm && mv bouncer.opt.wasm bouncer.wasm
          ls -lh bouncer.wasm
      # This only catches an accidentally stale build; it is not a code audit
      # or proof that any independently deployed contract matches this binary.
      - name: Check built artifact matches the source version marker
        run: node bouncer/scripts/check-wasm-artifact.mjs
      - name: Save the exact build for the testnet job
        uses: actions/upload-artifact@v4
        with:
          name: bouncer-wasm
          path: bouncer.wasm
          if-no-files-found: error
      - name: Build separate experimental testnet playback WASM
        working-directory: bouncer/contracts/bouncer
        run: RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown --release --features youtick-playback-v10
      # Keep the separately tested V10 artifact unoptimized. The V9 wasm-opt
      # command fails on V10's bulk-memory instructions without extra feature
      # flags; the one-shot diagnostic checks testnet protocol compatibility.
      - name: Check experimental playback marker
        run: |
          node -e 'const fs=require("fs"),c=require("crypto"),p="bouncer/contracts/bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm",b=fs.readFileSync(p);if(!b.subarray(0,8).equals(Buffer.from([0,97,115,109,1,0,0,0]))||!b.includes(Buffer.from("bouncer-agent-v10-youtick-testnet")))throw Error("invalid experimental playback artifact");console.log("Experimental playback WASM SHA-256",c.createHash("sha256").update(b).digest("hex"))'
      - name: Save the non-deployed playback variant for review
        uses: actions/upload-artifact@v4
        with:
          name: bouncer-youtick-playback-v10-wasm
          path: bouncer/contracts/bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm
          if-no-files-found: error
      - name: Build separate experimental exact FT intent WASM
        working-directory: bouncer/contracts/bouncer
        run: RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown --release --features exact-ft-v11
      - name: Check experimental exact FT marker
        run: |
          node -e 'const fs=require("fs"),c=require("crypto"),p="bouncer/contracts/bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm",b=fs.readFileSync(p);if(!b.subarray(0,8).equals(Buffer.from([0,97,115,109,1,0,0,0]))||!b.includes(Buffer.from("bouncer-agent-v11-exact-ft-testnet")))throw Error("invalid experimental exact FT artifact");const hash=c.createHash("sha256").update(b).digest("hex");console.log("Experimental exact FT WASM SHA-256",hash);console.log(`::notice title=V11 testnet WASM identification (not an audit)::sha256=${hash}, bytes=${b.length}`)'
      # Optional fallback when the standard artifact host is unreachable. The
      # compressed WASM is visible to private-repository check/log readers; it
      # must never contain secrets. A marker is not proof of human approval.
      # The first approved export revealed a 4,096-character live truncation.
      # Split into 4,000-character notices, at most nine in each separate step.
      # All ten guarded steps must use the same WASM and complete successfully;
      # extraction still fails closed if GitHub drops or changes any part.
      - name: Export V11 WASM in private review annotations
        if: github.event_name == 'push' && github.event.repository.private == true && github.run_attempt == '1' && github.ref == 'refs/heads/arena/3ee8cb60-near-hub' && contains(github.event.head_commit.message, '[v11-wasm-review-export]')
        run: node bouncer/scripts/v11-wasm-annotations.mjs emit bouncer/contracts/bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm 1
      - name: Export V11 WASM review batch 02 of 10
        if: github.event_name == 'push' && github.event.repository.private == true && github.run_attempt == '1' && github.ref == 'refs/heads/arena/3ee8cb60-near-hub' && contains(github.event.head_commit.message, '[v11-wasm-review-export]')
        run: node bouncer/scripts/v11-wasm-annotations.mjs emit bouncer/contracts/bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm 2
      - name: Export V11 WASM review batch 03 of 10
        if: github.event_name == 'push' && github.event.repository.private == true && github.run_attempt == '1' && github.ref == 'refs/heads/arena/3ee8cb60-near-hub' && contains(github.event.head_commit.message, '[v11-wasm-review-export]')
        run: node bouncer/scripts/v11-wasm-annotations.mjs emit bouncer/contracts/bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm 3
      - name: Export V11 WASM review batch 04 of 10
        if: github.event_name == 'push' && github.event.repository.private == true && github.run_attempt == '1' && github.ref == 'refs/heads/arena/3ee8cb60-near-hub' && contains(github.event.head_commit.message, '[v11-wasm-review-export]')
        run: node bouncer/scripts/v11-wasm-annotations.mjs emit bouncer/contracts/bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm 4
      - name: Export V11 WASM review batch 05 of 10
        if: github.event_name == 'push' && github.event.repository.private == true && github.run_attempt == '1' && github.ref == 'refs/heads/arena/3ee8cb60-near-hub' && contains(github.event.head_commit.message, '[v11-wasm-review-export]')
        run: node bouncer/scripts/v11-wasm-annotations.mjs emit bouncer/contracts/bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm 5
      - name: Export V11 WASM review batch 06 of 10
        if: github.event_name == 'push' && github.event.repository.private == true && github.run_attempt == '1' && github.ref == 'refs/heads/arena/3ee8cb60-near-hub' && contains(github.event.head_commit.message, '[v11-wasm-review-export]')
        run: node bouncer/scripts/v11-wasm-annotations.mjs emit bouncer/contracts/bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm 6
      - name: Export V11 WASM review batch 07 of 10
        if: github.event_name == 'push' && github.event.repository.private == true && github.run_attempt == '1' && github.ref == 'refs/heads/arena/3ee8cb60-near-hub' && contains(github.event.head_commit.message, '[v11-wasm-review-export]')
        run: node bouncer/scripts/v11-wasm-annotations.mjs emit bouncer/contracts/bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm 7
      - name: Export V11 WASM review batch 08 of 10
        if: github.event_name == 'push' && github.event.repository.private == true && github.run_attempt == '1' && github.ref == 'refs/heads/arena/3ee8cb60-near-hub' && contains(github.event.head_commit.message, '[v11-wasm-review-export]')
