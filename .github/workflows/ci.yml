  ai-testnet:
    name: Local AI-planned multi-resource testnet flow
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[ai-multi-resource]') || contains(github.event.head_commit.message, '[ai-provider-compare]') || contains(github.event.head_commit.message, '[ai-delivery-verify]'))
    needs: build-contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
