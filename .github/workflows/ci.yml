name: Build & Test Bouncer

on:
  push:
    branches: [arena/ebb614bb-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install binaryen
        run: sudo apt-get update -qq && sudo apt-get install -y binaryen
      - name: Cargo check wasm
        working-directory: bouncer/contracts/bouncer
        run: cargo check --target wasm32-unknown-unknown
      - name: Cargo build wasm (release)
        working-directory: bouncer/contracts/bouncer
        run: RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown --release
      - name: Shrink & commit wasm
        run: |
          set -e
          cp bouncer/contracts/bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm ./bouncer.wasm
          ls -lh bouncer.wasm
          # wasm-opt -Os folds panic paths to a single `unreachable` opcode and strips messages.
          # Use -O1 with --strip-debug so on-chain error strings stay readable.
          wasm-opt -O1 --strip-debug -o bouncer.opt.wasm bouncer.wasm && mv bouncer.opt.wasm bouncer.wasm
          ls -lh bouncer.wasm
          git config user.name "CI Bot"
          git config user.email "ci@bouncer.local"
          git add bouncer.wasm -f
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): attach bouncer.wasm"
            git push
          fi

  testnet-smoke:
    name: Manual live testnet smoke test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix bouncer --no-audit --no-fund
      # Testnet accounts and keys exist only on this ephemeral runner. No keys
      # are printed or uploaded. This creates real testnet transactions.
      - run: node bouncer/demo-all.mjs
