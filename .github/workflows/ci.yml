name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + wasm target
        run: |
          rustup update stable --no-self-update
          rustup target add wasm32-unknown-unknown
          rustc --version && cargo --version
      - name: Cargo check (wasm)
        working-directory: bouncer/contracts/bouncer
        shell: bash -euxo pipefail {0}
        run: |
          cargo check --target wasm32-unknown-unknown --message-format=short
      - name: Cargo build (wasm, debug)
        working-directory: bouncer/contracts/bouncer
        shell: bash -euxo pipefail {0}
        run: |
          cargo build --target wasm32-unknown-unknown --message-format=short
          ls -la ../../target/wasm32-unknown-unknown/debug/bouncer.wasm
          echo "wasm bytes: $(wc -c < ../../target/wasm32-unknown-unknown/debug/bouncer.wasm)"
      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: bouncer-wasm
          path: bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm
