    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      contents: write
      issues: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guarded-ref-testnet-recovery
          run-id: 41299191712
          github-token: ${{ github.token }}
          path: original-ref-evidence
      - uses: actions/download-artifact@v4
        with:
          name: original-ref-sweep-recovery
          run-id: 41300346933
          github-token: ${{ github.token }}
          path: prior-ref-sweep-attempt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      - name: Check both retained journals without signing or transaction broadcasts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOUNCER_REF_SWEEP_ACK: testnet-original-sweep-only
          BOUNCER_REF_SWEEP_ARTIFACT_CHECK_ONLY: '1'
        run: node bouncer/scripts/resume-original-ref-sweep.mjs original-ref-evidence prior-ref-sweep-attempt "$RUNNER_TEMP/artifact-check-only"
      - name: Check private read channels and annotation visibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          const headers = { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json', 'x-github-api-version': '2022-11-28' };
          const opts = { headers, signal: AbortSignal.timeout(15_000), redirect: 'error' };
          const base = 'https://api.github.com/repos/abdullahimujeeb0505-stack/Bouncer';
          const comments = await fetch(`${base}/issues/6/comments?per_page=1`, opts);
          const contents = await fetch(`${base}/contents/bouncer/README.md?ref=${process.env.GITHUB_SHA}`, { ...opts, signal: AbortSignal.timeout(15_000) });
          const contentsWrite = await fetch(`${base}/contents/bouncer/README.md`, { method: 'PUT', headers: { ...headers, 'content-type': 'application/json' },
            body: JSON.stringify({ message: 'Non-mutating permission probe', content: 'cHJvYmU=', sha: '0'.repeat(40), branch: 'arena/88d70c7c-near-hub' }),
            signal: AbortSignal.timeout(15_000), redirect: 'error' });
          const check = await fetch(`${base}/check-runs`, { method: 'POST', headers: { ...headers, 'content-type': 'application/json' },
            body: JSON.stringify({ name: `Scoped channel diagnostic ${process.env.GITHUB_RUN_ID}`, head_sha: process.env.GITHUB_SHA,
              external_id: `bouncer-probe-${process.env.GITHUB_RUN_ID}`,
              details_url: `https://github.com/abdullahimujeeb0505-stack/Bouncer/actions/runs/${process.env.GITHUB_RUN_ID}`,
              status: 'completed', conclusion: 'success', output: { title: 'Read-only test', summary: 'No key or transaction was used.' } }),
            signal: AbortSignal.timeout(15_000), redirect: 'error' });
          console.log(`::notice title=Scoped channel access::comments_http=${comments.status}; contents_http=${contents.status}; contents_write_mismatch_http=${contentsWrite.status}; checks_create_http=${check.status}`);
          if (!contents.ok) { console.log(`::error title=Scoped channel unavailable::Repository contents HTTP ${contents.status}`); process.exit(1); }
          console.log('::notice title=Scoped Ref sweep channel probe::Private repository contents are readable; this is not a sweep request.');
          NODE
      - name: Hold the probe open for annotation visibility
        run: sleep 60

