name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Show versions
        run: |
          rustc -vV
          cargo -vV
          which rust-lld || echo "no rust-lld"
          ls ~/.rustup/toolchains/*/lib/rustlib/wasm32-unknown-unknown/lib/ 2>&1 | head -20 || true
      - name: Cargo build (debug, verbose)
        working-directory: bouncer/contracts/bouncer
        run: |
          RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown -v 2>&1 | tail -200
      - name: Find wasm
        run: |
          echo "FIND:"
          find . -name "bouncer.wasm" 2>&1
          ls -la bouncer/target/wasm32-unknown-unknown/debug/ 2>&1 | head -30 || echo "no outer bouncer/target"
          ls -la bouncer/contracts/bouncer/target/wasm32-unknown-unknown/debug/ 2>&1 | head -30 || echo "no inner target"
      - name: Copy wasm
        run: |
          mkdir -p dist
          if [ -f bouncer/contracts/bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm ]; then
            cp bouncer/contracts/bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm dist/bouncer.wasm
          elif [ -f bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm ]; then
            cp bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm dist/bouncer.wasm
          fi
          ls -la dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bouncer-wasm
          path: dist/bouncer.wasm
          if-no-files-found: ignore
