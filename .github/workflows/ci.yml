name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install cargo-near (standard Near build tool)
        run: |
          # Install cargo-near via its installer
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh -s -- --no-modify-path 2>&1 | tail -20 || true
          ls "$HOME/.cargo/bin/" 2>&1 || true
          which cargo-near || echo "no cargo-near in path; will use cargo build"
      - name: Cargo build
        working-directory: bouncer/contracts/bouncer
        run: |
          echo "WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          ls
          # plain cargo build, no tail, no shell pipes to avoid exit code confusion
          RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown
          echo "--- AFTER BUILD ---"
          ls -la
          ls -la target/ 2>&1 || true
          ls -la target/wasm32-unknown-unknown/ 2>&1 || true
          ls -la target/wasm32-unknown-unknown/debug/ 2>&1 || true
      - name: Find & copy wasm
        run: |
          set -x
          find $GITHUB_WORKSPACE -name "*.wasm" -not -path "*/node_modules/*" 2>&1
          mkdir -p dist
          # cargo build from working-directory bouncer/contracts/bouncer places target at bouncer/contracts/bouncer/target/ (cargo targets go under manifest dir)
          cp bouncer/contracts/bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm dist/bouncer.wasm 2>&1 || \
            cp bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm dist/bouncer.wasm 2>&1 || \
            find $GITHUB_WORKSPACE -name "bouncer.wasm" -not -path "*/node_modules/*" -exec cp {} dist/bouncer.wasm \;
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: bouncer-wasm
          path: dist/bouncer.wasm
          if-no-files-found: error
