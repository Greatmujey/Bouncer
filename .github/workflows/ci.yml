name: Build & Test Bouncer

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # Isolated, lockfile-pinned third-party seller SDK. Its NEAR driver is
      # wrapped only in tests because the published preset is mainnet-only.
      - run: npm ci --prefix interop/piprail --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - run: npm test
        env:
          BOUNCER_PIPRAIL_PACKAGE_ROOT: ${{ github.workspace }}/bouncer/interop/piprail/node_modules/@piprail/sdk
      - name: Check the committed wallet bundle matches its source
        run: npm run build:web && git diff --exit-code -- web/wallet.bundle.js
      - name: Test onboarding, mobile layout and testnet wallet UI
        env:
          GH_TOKEN: ${{ github.token }}
          BOUNCER_PLAYWRIGHT_PATH: ${{ runner.temp }}/bouncer-browser/node_modules/playwright-core/index.mjs
          BOUNCER_METEOR_EXECUTOR: ${{ runner.temp }}/meteor-executor.js
        run: |
          npm install --prefix "$RUNNER_TEMP/bouncer-browser" --no-save --no-audit --no-fund playwright-core@1.64.1
          # Public, pinned vendor executor; test verifies its SHA-256 before use.
          gh api repos/Meteor-Wallet/meteor_wallet_sdk/git/blobs/b76fb93ff5d47064845d09313173b6eddbfa64e3 --jq .content | base64 -d > "$BOUNCER_METEOR_EXECUTOR"
          node scripts/test-web-browser.mjs

  contract-tests:
    name: Rust contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test policy, authorization and refund logic
        working-directory: bouncer/contracts/bouncer
        shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never CARGO_PROFILE_DEV_DEBUG=0 cargo test --lib 2>&1 | tee "$RUNNER_TEMP/rust-test.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Rust tests failed::"+s)' "$RUNNER_TEMP/rust-test.log"
          fi
          exit "$result"

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install binaryen
        run: sudo apt-get update -qq && sudo apt-get install -y binaryen
      - name: Cargo check and build wasm
        working-directory: bouncer/contracts/bouncer
        shell: bash
        run: |
          set +e
          (cargo check --target wasm32-unknown-unknown && RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown --release) 2>&1 | tee "$RUNNER_TEMP/wasm-build.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Wasm build failed::"+s)' "$RUNNER_TEMP/wasm-build.log"
          fi
          exit "$result"
      - name: Optimize wasm
        run: |
          set -e
          cp bouncer/contracts/bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm ./bouncer.wasm
          # -Os can strip panic messages; -O1 keeps errors readable.
          wasm-opt -O1 --strip-debug -o bouncer.opt.wasm bouncer.wasm && mv bouncer.opt.wasm bouncer.wasm
          ls -lh bouncer.wasm
      # This only catches an accidentally stale build; it is not a code audit
      # or proof that any independently deployed contract matches this binary.
      - name: Check built artifact matches the source version marker
        run: node bouncer/scripts/check-wasm-artifact.mjs
      - name: Save the exact build for the testnet job
        uses: actions/upload-artifact@v4
        with:
          name: bouncer-wasm
          path: bouncer.wasm
          if-no-files-found: error
      - name: Commit built wasm on branch pushes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/') && !contains(github.event.head_commit.message, '[artifact-only]')
        run: |
          git config user.name "CI Bot"
          git config user.email "ci@bouncer.local"
          git add bouncer.wasm -f
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): attach bouncer.wasm"
            git push
          fi

  circle-usdc-live:
    name: Circle testnet USDC guarded multi-resource mission
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[circle-usdc-live]')
    needs: build-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bouncer-wasm
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      - name: Pay and verify three development resources with Circle testnet USDC
        shell: bash
        run: |
          set +e
          node bouncer/demo-circle-usdc.mjs 2>&1 | tee "$RUNNER_TEMP/circle-usdc-live.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-4000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Circle testnet USDC live check failed::"+s)' "$RUNNER_TEMP/circle-usdc-live.log"
          fi
          exit "$result"
      # These files contain public testnet orders and transaction IDs, never keys.
      - name: Preserve unresolved public testnet journal and provider state
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: circle-usdc-unresolved-journal
          path: |
            /tmp/bouncer-usdc-*/journal.json
            /tmp/bouncer-usdc-*/goals.json
            /tmp/bouncer-usdc-*/plan.json
            /tmp/bouncer-usdc-*/provider-config.json
            /tmp/bouncer-usdc-*/development-provider/**
          if-no-files-found: ignore
          retention-days: 7

  oracle-mission-live:
    name: Pinned independent oracle and Circle multi-resource mission (testnet)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[oracle-live]')
    needs: build-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bouncer-wasm
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      # Testnet only, ephemeral keys; one independent purchase, no automatic
      # payment retries. Circle payments go to a local development provider.
      - name: Verify pinned independent data and Circle development resources
        shell: bash
        run: |
          set +e
          node bouncer/demo-oracle-mission.mjs 2>&1 | tee "$RUNNER_TEMP/oracle-mission.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-4500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Oracle mission live check failed::"+s)' "$RUNNER_TEMP/oracle-mission.log"
          fi
          exit "$result"
      - name: Preserve unresolved public testnet evidence, never keys
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-mission-unresolved
          path: |
            /tmp/bouncer-oracle-*/journal.json
            /tmp/bouncer-oracle-*/oracle-goal.json
            /tmp/bouncer-oracle-*/resource-goals.json
            /tmp/bouncer-oracle-*/resource-plan.json
            /tmp/bouncer-oracle-*/provider-config.json
            /tmp/bouncer-oracle-*/development-provider/**
          if-no-files-found: ignore
          retention-days: 7

  dependent-workflow-live:
    name: Dependent oracle to compute, storage and API (testnet)
    # Explicit one-shot opt-in only. This uses a new, isolated testnet account;
    # it does not touch or retry the separately unresolved project transaction.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[dependent-live]')
    needs: [js-tests, contract-tests, build-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bouncer-wasm
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      # One native OutLayer purchase and three Circle testnet USDC payments to
      # local development software. Testnet tokens have no value. No ambiguous
      # payment is retried; recovery is by the original signed hash only.
      - name: Run and recover the chained testnet workflow
        shell: bash
        run: |
          set +e
          node bouncer/demo-oracle-mission.mjs --dependent-workflow 2>&1 | tee "$RUNNER_TEMP/dependent-live.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-4500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Dependent workflow live check failed::"+s)' "$RUNNER_TEMP/dependent-live.log"
          fi
          exit "$result"
      # Both success and failure evidence are public testnet inputs, hashes and
      # local-provider state. Ephemeral private keys are never written to disk.
      - name: Preserve testnet workflow evidence, never keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependent-workflow-public-evidence
          path: |
            /tmp/bouncer-dependent-live-*/journal.json
            /tmp/bouncer-dependent-live-*/setup-journal.json
            /tmp/bouncer-dependent-live-*/oracle-goal.json
            /tmp/bouncer-dependent-live-*/workflow.json
            /tmp/bouncer-dependent-live-*/derived-orders.json
            /tmp/bouncer-dependent-live-*/evidence.json
            /tmp/bouncer-dependent-live-*/provider-config.json
            /tmp/bouncer-dependent-live-*/development-provider/**
          if-no-files-found: ignore
          retention-days: 90

  seller-v2-workflow-live:
    name: Seller-v2 dependent workflow and recovery (testnet)
    # One fresh, explicit testnet run. Re-running a GitHub Actions run must not
    # silently repeat its payments; investigate an ambiguous hash instead.
    if: github.event_name == 'push' && github.run_attempt == '1' && contains(github.event.head_commit.message, '[seller-v2-live]')
    needs: [js-tests, contract-tests, build-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bouncer-wasm
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      # One native OutLayer oracle execution, then three Circle testnet USDC
      # payments to the self-hosted reference seller, not an independent seller.
      # No ambiguous payment is retried; the exact signed hash is journaled.
      - name: Run and recover seller-v2 orders
        shell: bash
        run: |
          set +e
          node bouncer/demo-oracle-mission.mjs --seller-v2-workflow 2>&1 | tee "$RUNNER_TEMP/seller-v2-live.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-4500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Seller-v2 testnet check failed::"+s)' "$RUNNER_TEMP/seller-v2-live.log"
          fi
          exit "$result"
      # Public testnet inputs, memos, hashes and local state, never private keys.
      - name: Preserve seller-v2 testnet evidence, never keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-v2-workflow-public-evidence
          path: |
            /tmp/bouncer-seller-v2-live-*/journal.json
            /tmp/bouncer-seller-v2-live-*/setup-journal.json
            /tmp/bouncer-seller-v2-live-*/oracle-goal.json
            /tmp/bouncer-seller-v2-live-*/workflow.json
            /tmp/bouncer-seller-v2-live-*/derived-orders.json
            /tmp/bouncer-seller-v2-live-*/evidence.json
            /tmp/bouncer-seller-v2-live-*/provider-config.json
            /tmp/bouncer-seller-v2-live-*/development-provider/**
          if-no-files-found: ignore
          retention-days: 90

  seller-v3-workflow-live:
    name: Authenticated seller-v3 dependent workflow (testnet)
    # One explicit fresh testnet run; Actions reruns never repeat its payments.
    if: github.event_name == 'push' && github.event.repository.private == true && github.run_attempt == '1' && contains(github.event.head_commit.message, '[seller-v3-live]')
    needs: [js-tests, contract-tests, build-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bouncer-wasm
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      # One native testnet OutLayer call and three Circle testnet USDC payments
      # to our local development seller, never an independent FT merchant.
      - name: Run authenticated orders and key-free recovery
        shell: bash
        run: |
          set +e
          node bouncer/demo-oracle-mission.mjs --seller-v3-workflow 2>&1 | tee "$RUNNER_TEMP/seller-v3-live.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-4500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Seller-v3 testnet check failed::"+s)' "$RUNNER_TEMP/seller-v3-live.log"
          fi
          exit "$result"
      # Repository-restricted artifact: the buyer journal contains replayable
      # testnet claim signatures and task data, but never private keys. Preserve
      # the original on both success and failure for safe reconciliation.
      - name: Preserve sensitive testnet recovery evidence, never keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-v3-restricted-recovery-evidence
          path: |
            /tmp/bouncer-seller-v3-live-*/journal.json
            /tmp/bouncer-seller-v3-live-*/setup-journal.json
            /tmp/bouncer-seller-v3-live-*/oracle-goal.json
            /tmp/bouncer-seller-v3-live-*/workflow.json
            /tmp/bouncer-seller-v3-live-*/derived-orders.json
            /tmp/bouncer-seller-v3-live-*/evidence.json
            /tmp/bouncer-seller-v3-live-*/provider-config.json
            /tmp/bouncer-seller-v3-live-*/development-provider/**
          if-no-files-found: ignore
          retention-days: 90

  reconcile-seller-v3-oracle:
    name: Reconcile the seller-v3 run's original oracle (read only)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[seller-v3-reconcile]')
    needs: js-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seller-v3-restricted-recovery-evidence
          path: ${{ runner.temp }}/seller-v3-original
          github-token: ${{ github.token }}
          run-id: 41268548592
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      # Read the preserved original only. No keys, writes, new orders, or sends.
      - name: Verify the original source hash and no resource broadcasts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t journals < <(find "$RUNNER_TEMP/seller-v3-original" -type f -name journal.json)
          mapfile -t goals < <(find "$RUNNER_TEMP/seller-v3-original" -type f -name oracle-goal.json)
          test "${#journals[@]}" -eq 1 && test "${#goals[@]}" -eq 1
          node --input-type=module - "${journals[0]}" "${goals[0]}" <<'NODE'
          import fs from 'node:fs';
          import { selectJournalOracle } from './bouncer/scripts/reconcile-oracle-journal.mjs';
          const journal = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const goal = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const { entry } = selectJournalOracle(goal, journal);
          if (entry.tx_hash !== 'CCbbcM73XZc1r8WcmyPMYHaudaR7qfjKKYhihZpHcuZ8') throw new Error('unexpected source hash');
          if (journal.entries.some(e => e?.request?.resource || e?.resource_authorization)) throw new Error('unexpected resource payment or authorization in journal');
          console.log('Original journal confirms zero resource broadcasts; no signed claims or entries were printed.');
          NODE
          node bouncer/scripts/reconcile-oracle-journal.mjs "${journals[0]}" "${goals[0]}"

  piprail-onchain-proof-live:
    name: One-shot onchain-proof SDK interoperability (testnet)
    # A fresh self-hosted SDK gate and one Circle testnet USDC payment only.
    # Re-running an Actions run never repeats setup or payment.
    if: github.event_name == 'push' && github.run_attempt == '1' && contains(github.event.head_commit.message, '[piprail-live]')
    needs: [js-tests, contract-tests, build-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bouncer-wasm
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      - run: npm ci --prefix bouncer/interop/piprail --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Run one guarded payment and recover its original hash
        env:
          BOUNCER_PIPRAIL_PACKAGE_ROOT: ${{ github.workspace }}/bouncer/interop/piprail/node_modules/@piprail/sdk
        shell: bash
        run: |
          set +e
          node bouncer/demo-onchain-proof.mjs 2>&1 | tee "$RUNNER_TEMP/piprail-live.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-4500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Onchain-proof testnet check failed::"+s)' "$RUNNER_TEMP/piprail-live.log"
          fi
          exit "$result"
      # Public testnet inputs, responses and hashes; never private keys.
      - name: Preserve onchain-proof recovery evidence, never keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piprail-onchain-proof-public-evidence
          path: |
            /tmp/bouncer-piprail-live-*/setup-journal.json
            /tmp/bouncer-piprail-live-*/journal.json
            /tmp/bouncer-piprail-live-*/goal.json
            /tmp/bouncer-piprail-live-*/evidence.json
          if-no-files-found: ignore
          retention-days: 90

  ft-call-live:
    name: Guarded independent FT funding, paid test connector and refund (testnet)
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[ft-call-live]') || contains(github.event.head_commit.message, '[paid-compute-live]'))
    needs: build-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bouncer-wasm
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      # A receipt-inclusive historical regression must pass before any new
      # account setup, test-token funding or project purchase is attempted.
      - name: Verify the previous paid connector transaction (read only)
        run: node bouncer/scripts/verify-project-history.mjs
      - name: Test pinned FT funding, paid independent probe and rejection refund
        shell: bash
        env:
          BOUNCER_PAID_PROBE: ${{ contains(github.event.head_commit.message, '[paid-compute-live]') && 'burn' || 'fetch' }}
        run: |
          set +e
          node bouncer/demo-ft-call.mjs 2>&1 | tee "$RUNNER_TEMP/ft-call-live.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-4000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Guarded FT call live check failed::"+s)' "$RUNNER_TEMP/ft-call-live.log"
          fi
          exit "$result"
      - name: Preserve unresolved public testnet journals
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ft-call-unresolved-journals
          path: |
            /tmp/bouncer-ftcall-*/journal.json
            /tmp/bouncer-ftcall-*/goal.json
            /tmp/bouncer-ftcall-*/refund-goal.json
            /tmp/bouncer-ftcall-*/project-goal.json
            /tmp/bouncer-ftcall-*/resource-goals.json
            /tmp/bouncer-ftcall-*/development-provider/**
          if-no-files-found: ignore
          retention-days: 7

  outlayer-guarded:
    name: Guarded independent OutLayer testnet compute
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[outlayer-live]')
    needs: build-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bouncer-wasm
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      # Fresh testnet-only account and keys, never uploaded. One guarded paid
      # execution; intentionally corrupted local evidence is recovered by hash.
      - name: Execute under Bouncer policy and verify independent delivery
        shell: bash
        run: |
          set +e
          node bouncer/demo-outlayer.mjs 2>&1 | tee "$RUNNER_TEMP/outlayer-live.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-3500).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Guarded OutLayer live check failed::"+s)' "$RUNNER_TEMP/outlayer-live.log"
          fi
          exit "$result"
      # The journal has public testnet order/transaction data, never private
      # keys. Preserve it on failure so an ambiguous payment can be reconciled.
      - name: Preserve unresolved public payment journal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: outlayer-unresolved-journal
          path: |
            /tmp/bouncer-outlayer-*/journal.json
            /tmp/bouncer-outlayer-*/goal.json
          if-no-files-found: ignore
          retention-days: 14

