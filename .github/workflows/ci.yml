name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cargo build
        working-directory: bouncer/contracts/bouncer
        run: |
          pwd
          RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown -v 2>&1 | tail -100
          ls target/wasm32-unknown-unknown/debug/
          cp target/wasm32-unknown-unknown/debug/bouncer.wasm ./bouncer.wasm
          ls -lh ./bouncer.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: bouncer-wasm
          path: bouncer/contracts/bouncer/bouncer.wasm
          if-no-files-found: error
