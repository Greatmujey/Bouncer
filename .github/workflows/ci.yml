name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Show versions
        run: |
          rustc -vV
          cargo -vV
      - name: Cargo build (debug, verbose)
        working-directory: bouncer/contracts/bouncer
        run: |
          RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown -v 2>&1 | tail -200
      - name: Locate wasm & copy
        run: |
          set -euo pipefail
          mkdir -p dist
          # With working-directory set above, `cargo build` puts target in bouncer/contracts/bouncer/target/
          echo "--- listing all wasm files ---"
          find . -name "*.wasm" -not -path "*/node_modules/*"
          SRC="bouncer/contracts/bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm"
          if [ ! -f "$SRC" ]; then
            SRC="bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm"
          fi
          echo "using source: $SRC"
          ls -la "$SRC"
          cp "$SRC" dist/bouncer.wasm
          echo "--- dist ---"
          ls -la dist/bouncer.wasm
          wc -c dist/bouncer.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: bouncer-wasm
          path: dist/bouncer.wasm
          if-no-files-found: error
          compression-level: 0
