name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install binaryen
        run: sudo apt-get update -qq && sudo apt-get install -y binaryen
      - name: Build (plain cargo, no cargo-near complications)
        working-directory: bouncer/contracts/bouncer
        shell: bash {0}
        run: |
          # Exact recipe from near-sdk.io: cargo build --target wasm32-unknown-unknown with link-arg=-s in cargo config
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [target.wasm32-unknown-unknown]
          rustflags = ["-C", "link-arg=-s"]
          EOF
          cat .cargo/config.toml
          cargo build --target wasm32-unknown-unknown --release
          echo "=== find wasm ==="
          find target -name "*.wasm"
          ls -la target/wasm32-unknown-unknown/release/bouncer.wasm
          cp target/wasm32-unknown-unknown/release/bouncer.wasm ${{ github.workspace }}/bouncer.wasm
      - name: Optimize & commit
        run: |
          ls -lh bouncer.wasm
          wasm-opt -Os -o bouncer.opt.wasm bouncer.wasm && mv bouncer.opt.wasm bouncer.wasm
          ls -lh bouncer.wasm
          git config user.name "CI Bot"
          git config user.email "ci@bouncer.local"
          git add bouncer.wasm -f
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): attach bouncer.wasm (release build)"
            git push
          fi
