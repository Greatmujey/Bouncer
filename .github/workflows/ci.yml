name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Show versions
        run: |
          rustc -vV
          cargo -vV
      - name: Cargo build (debug, verbose)
        run: |
          echo "PWD=$(pwd)"
          ls bouncer/contracts/bouncer/
          cd bouncer/contracts/bouncer
          echo "now at $(pwd)"
          ls
          RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown -v 2>&1 | tail -200
          echo "---target---"
          ls target/wasm32-unknown-unknown/debug/ | head -40
      - name: Locate wasm & copy
        run: |
          set -euo pipefail
          mkdir -p dist
          echo "--- listing all wasm files ---"
          find . -name "*.wasm" -not -path "*/node_modules/*"
          SRC=""
          for cand in bouncer/contracts/bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm target/wasm32-unknown-unknown/debug/bouncer.wasm; do
            if [ -f "$cand" ]; then SRC="$cand"; break; fi
          done
          echo "SRC=$SRC"
          test -n "$SRC"
          cp "$SRC" dist/bouncer.wasm
          ls -la dist/bouncer.wasm
          wc -c dist/bouncer.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: bouncer-wasm
          path: dist/bouncer.wasm
          if-no-files-found: error
          compression-level: 0
