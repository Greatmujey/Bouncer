name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cargo build
        working-directory: bouncer/contracts/bouncer
        run: |
          set -euxo pipefail
          ls
          RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown -v 2>&1 | tail -80
          echo "--- ls target/wasm32-unknown-unknown/debug ---"
          ls -la ../../target/wasm32-unknown-unknown/debug/ 2>&1 | head -30 || true
          echo "--- ls target ---"
          ls target/wasm32-unknown-unknown/debug/ 2>&1 | head -30 || true
      - name: Copy wasm to repo
        run: |
          mkdir -p bouncer/contracts/bouncer
          ls bouncer/target/wasm32-unknown-unknown/debug/ 2>&1 || true
          find bouncer -name "bouncer.wasm" 2>&1
          if [ -f bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm ]; then
            cp bouncer/target/wasm32-unknown-unknown/debug/bouncer.wasm ./bouncer.wasm
          else
            find . -name "bouncer.wasm" -exec cp {} ./bouncer.wasm \;
          fi
          ls -lh ./bouncer.wasm || echo "STILL NO WASM"
      - uses: actions/upload-artifact@v4
        with:
          name: bouncer-wasm
          path: bouncer.wasm
          if-no-files-found: error
