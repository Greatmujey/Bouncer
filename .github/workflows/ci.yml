name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build and upload log
        run: |
          set +e
          cd bouncer/contracts/bouncer
          rm -f .cargo/config.toml
          RUSTFLAGS="-C link-arg=-s" cargo build --target wasm32-unknown-unknown -v > /tmp/build.log 2>&1
          EC=$?
          echo "exit=$EC"
          echo "== tail of build log =="
          tail -80 /tmp/build.log
          echo "== find wasm =="
          find /home/runner -name "*.wasm" 2>&1 | head -30
          echo "== list target dir =="
          ls -la target/ 2>&1
          ls -la target/wasm32-unknown-unknown/ 2>&1 || true
          ls -la target/wasm32-unknown-unknown/debug/ 2>&1 || true
          echo "=="
          exit $EC
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
