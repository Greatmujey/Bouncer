name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-tools for stripping
        run: |
          # binaryen's wasm-opt (optional); fall back gracefully
          which wasm-opt || (sudo apt-get update -qq && sudo apt-get install -y binaryen) || true
      - name: Cargo build
        working-directory: bouncer/contracts/bouncer
        run: |
          set -euxo pipefail
          rustc --version
          # Build debug (which works); strip/opt afterward if possible
          cargo build --target wasm32-unknown-unknown -v 2>&1 | tail -40
          ls -la target/wasm32-unknown-unknown/debug/
          cp target/wasm32-unknown-unknown/debug/bouncer.wasm ./bouncer.wasm
          if command -v wasm-opt; then
            wasm-opt -Os -o bouncer_opt.wasm ./bouncer.wasm && mv bouncer_opt.wasm ./bouncer.wasm
          fi
          ls -lh ./bouncer.wasm
          echo "Wasm size:"
          wc -c ./bouncer.wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bouncer-wasm
          path: bouncer/contracts/bouncer/bouncer.wasm
          if-no-files-found: error
