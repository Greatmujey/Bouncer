name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install cargo-near (the standard NEAR build tool)
        run: |
          set -e
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Build with cargo-near
        run: |
          set -eux
          cd bouncer/contracts/bouncer
          which cargo-near
          cargo-near --version
          cargo-near build --no-docker
          # cargo-near outputs to target/wasm32-unknown-unknown/release/bouncer.wasm
          ls -la target/wasm32-unknown-unknown/release/
          cp target/wasm32-unknown-unknown/release/bouncer.wasm ../../../bouncer.wasm
          cd ../../..
          ls -la bouncer.wasm
          wc -c bouncer.wasm
      - name: Commit wasm back to branch
        run: |
          git config user.name "CI Bot"
          git config user.email "ci@bouncer.local"
          git add bouncer.wasm -f
          if git diff --cached --quiet; then
            echo "No change to bouncer.wasm"
          else
            git commit -m "chore(ci): attach bouncer.wasm build artifact"
            git push
          fi
