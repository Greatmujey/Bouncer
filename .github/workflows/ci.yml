name: Build & Test Bouncer

on:
  push:
    branches: [arena/3419a30c-near-hub]
  pull_request:
  workflow_dispatch:

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  build-contract:
    name: Build Rust contract (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cargo build
        working-directory: bouncer/contracts/bouncer
        run: |
          cargo build --release --target wasm32-unknown-unknown
          ls -la ../../target/wasm32-unknown-unknown/release/bouncer.wasm
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bouncer-wasm
          path: bouncer/target/wasm32-unknown-unknown/release/bouncer.wasm
