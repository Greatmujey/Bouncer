  native-qa-original-diagnosis:
    name: Inspect the previous QA failure (read only)
    # Read only: no faucet, wallet, signer or transaction. Fetch the old log
    # privately and expose only its bounded, redacted QA error line.
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/0e4386ea-near-hub' && github.event.before == '903bc3bc2935ebd873fa155c4db38b920d543bbb' && github.run_attempt == '1' && contains(github.event.head_commit.message, '[native-qa-read-original-log]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read the stopped QA job without exposing log URLs or secrets
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error --location --max-time 60 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/Greatmujey/Bouncer/actions/jobs/128664415262/logs > "$RUNNER_TEMP/old-qa.log" 2> "$RUNNER_TEMP/log-download.err"; then
            node - "$RUNNER_TEMP/log-download.err" <<'NODE'
          const fs = require('fs'); let text = fs.readFileSync(process.argv[2], 'utf8').replace(/https?:\/\/\S+/g, '[url]').replace(/ed25519:[1-9A-HJ-NP-Za-km-z]+/g, '[key]').slice(0, 400).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          console.log('::notice title=Read-only log access::' + text);
          NODE
            exit 1
          fi
          node - "$RUNNER_TEMP/old-qa.log" <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync(process.argv[2], 'utf8').split('\n').filter(x => x.includes('QA stopped:'));
          if (lines.length !== 1) { console.log('::error::Expected one bounded QA stop line.'); process.exit(1); }
          const text = lines[0].slice(lines[0].indexOf('QA stopped:')).replace(/https?:\/\/\S+/g, '[url]').replace(/ed25519:[1-9A-HJ-NP-Za-km-z]+/g, 'ed25519:[redacted]').slice(0, 700).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          console.log('::notice title=Previous QA stop::' + text);
          NODE
          mkdir -p "$RUNNER_TEMP/public-qa"
          gh run download 42458530561 --repo Greatmujey/Bouncer --name native-qa-42458530561-public-results --dir "$RUNNER_TEMP/public-qa" > "$RUNNER_TEMP/artifact-download.log" 2>&1 || { echo '::error::Previous public QA result unavailable.'; exit 1; }
          node - "$RUNNER_TEMP/public-qa/faucet-result.json" <<'NODE'
          const fs = require('fs'); const x = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (x.status !== 'OWNER_OBSERVED_AT_FINAL' || !/^bouncer-owner-[a-f0-9]{24}\.testnet$/.test(x.account_id) || !/^[1-9A-HJ-NP-Za-km-z]{32,60}$/.test(x.block_hash)) process.exit(1);
          console.log('::notice title=Previous QA account::' + JSON.stringify({status:x.status, account_id:x.account_id, block_hash:x.block_hash, helper_acknowledgement:x.helper_acknowledgement, do_not_repeat_helper_request:x.do_not_repeat_helper_request}));
          NODE

  native-wallet-qa:
    name: One-shot native wallet plan (disposable testnet QA)
    # This one run uses a new, locally generated QA account, NEVER the user's
    # wallet. Each original is uploaded separately before its one send. Public
    # artifacts contain only public hashes/terms; private keys and signed bytes
    # remain in RUNNER_TEMP and are destroyed with the runner. No reruns.
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/0e4386ea-near-hub' && github.event.before == '5e0cf437c78b0b25087bcb285c4f2d6df5fb6591' && github.run_attempt == '1' && contains(github.event.head_commit.message, '[native-wallet-qa-once]')
