# Capture a public dependency lock for the experimental testnet V12 build.
# No keys, transactions, providers, deployment, or branch writes.
name: Capture V12 dependency lock (no deployment)
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  lock:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[v12-lock-snapshot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - name: Resolve and export the public lock, with a digest
        working-directory: bouncer/contracts/bouncer
        run: |
          set -euo pipefail
          test ! -f Cargo.lock
          cargo generate-lockfile
          python3 - <<'PY'
          import base64,hashlib,pathlib
          b=pathlib.Path('Cargo.lock').read_bytes()
          if not 1000 <= len(b) <= 200_000: raise ValueError('unexpected lockfile size')
          data=base64.b64encode(b).decode('ascii'); chunks=[data[i:i+5000] for i in range(0,len(data),5000)]
          print('::notice title=V12 dependency lock digest::'+hashlib.sha256(b).hexdigest()+' '+str(len(b))+' '+str(len(chunks)))
          for i,c in enumerate(chunks,1): print('::notice title=V12 dependency lock chunk '+str(i).zfill(3)+'::'+c)
          PY
