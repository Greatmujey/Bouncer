# Read-only lookup of the already-signed original topup; never submits it.
name: Reconcile named-account vault topup (read only)

on:
  push:
    branches: ['arena/**']

permissions:
  contents: read

jobs:
  reconcile:
    if: contains(github.event.head_commit.message, '[named-vault-topup-reconcile]')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install lockfile and test original-hash recovery
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/named-vault-topup.test.mjs tests/read-only-near-receipts.test.mjs
      - name: Reconcile the original hash and fresh balances
        run: |
          set -euo pipefail
          if ! node scripts/reconcile-named-vault-topup.mjs > "$RUNNER_TEMP/named-reconcile.json" 2> "$RUNNER_TEMP/named-reconcile-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/named-reconcile-error.log").read()[-2500:]; print("::error title=Original named topup remains unresolved; never resend::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## Read-only named-account topup reconciliation'
            echo 'The original transaction and fresh balances were inspected; no signature, send or seller contact occurred.'
            echo '```json'
            cat "$RUNNER_TEMP/named-reconcile.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; d=json.load(open(os.environ["RUNNER_TEMP"]+"/named-reconcile.json")); s=json.dumps(d,separators=(",",":")); print("::notice title=Named topup original-hash reconciliation::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
