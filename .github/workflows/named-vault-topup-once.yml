# ONE-SHOT TESTNET topup. Public signed bytes can be relayed by anyone.
# The private key stays local. Never retry an unknown original hash.
name: Fund existing vault from named testnet account once

on:
  push:
    branches: ['arena/25a7aaf6-near-hub']

permissions:
  contents: read
  actions: read

jobs:
  topup:
    if: github.event.before == '3ad41fbd970ea7e0378e0d481e80c1d4b640d9d8' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[named-vault-topup-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test fixed action, journal, receipt and fence safeguards
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/named-vault-topup.test.mjs tests/keyless-vault-circle.test.mjs tests/github-original-fence.test.mjs tests/read-only-near-receipts.test.mjs
      - name: Prepare public original-hash fence
        id: plan
        run: |
          set -euo pipefail
          file='evidence/greatmujey-testnet/vault-topup-original.json'
          digest="$(sha256sum "$file" | cut -d' ' -f1)"
          echo "sha=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/named-vault-topup-fence"
          cp "$file" "$RUNNER_TEMP/named-vault-topup-fence/original.json"
          printf 'network=testnet\nrun_id=%s\ncommit=%s\nenvelope_sha256=%s\nrequest=one vault topup; reconcile, never blindly resend\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$digest" > "$RUNNER_TEMP/named-vault-topup-fence/attempt.txt"
      - name: Retain original-hash fence before the one send
        id: fence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: named-vault-topup-fence-${{ github.run_id }}-${{ steps.plan.outputs.sha }}
          path: ${{ runner.temp }}/named-vault-topup-fence/
          retention-days: 30
          if-no-files-found: error
      - name: Recheck fresh state, send once, verify original receipts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOUNCER_FENCE_ARTIFACT_ID: ${{ steps.fence.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if ! node scripts/broadcast-named-vault-topup-once.mjs > "$RUNNER_TEMP/named-topup-result.json" 2> "$RUNNER_TEMP/named-topup-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/named-topup-error.log").read()[-3000:]; print("::error title=Original named vault topup not confirmed; never resend::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## One fixed testnet vault topup'
            echo 'Locally signed test-USDC transfer into the existing keyless vault, not a seller payment or independent delivery. No private key entered CI.'
            echo '```json'
            cat "$RUNNER_TEMP/named-topup-result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; d=json.load(open(os.environ["RUNNER_TEMP"]+"/named-topup-result.json")); s=json.dumps(d,separators=(",",":")); print("::notice title=Named testnet vault topup result::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
