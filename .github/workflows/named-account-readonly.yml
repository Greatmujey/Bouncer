# Public read-only RPC inventory only. No secrets, account creation or payment.
name: Named account inventory (read only)

on:
  push:
    branches: ['arena/**']

permissions:
  contents: read

jobs:
  inventory:
    if: contains(github.event.head_commit.message, '[named-account-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install existing dependencies and test view-only inventory
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/named-testnet-inventory.test.mjs
      - name: Inspect fixed public account IDs
        run: |
          set -euo pipefail
          node scripts/inspect-named-accounts.mjs > "$RUNNER_TEMP/named-inventory.json"
          {
            echo '## Public named-account inventory'
            echo 'Trusted-RPC FINAL views only; no private keys, helper, payment or seller contact. An FT balance can exist for an uncreated NEAR account.'
            echo '```json'
            cat "$RUNNER_TEMP/named-inventory.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; d=json.load(open(os.environ["RUNNER_TEMP"]+"/named-inventory.json")); s=json.dumps(d,separators=(",",":")); assert len(s)<12000; print("::notice title=Named public account inventory::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
