name: Website preview and read-only smoke

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-preview:
    # A guest snapshot is published only on this explicit marker. It cannot
    # host the Google session API and cannot be used for Google sign-in.
    if: contains(github.event.head_commit.message, '[publish-web-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public assets and publish a temporary snapshot
        env:
          BOUNCER_PREVIEW_URL_FILE: ${{ runner.temp }}/bouncer-preview-url.txt
        run: |
          node --test bouncer/tests/web.test.mjs bouncer/tests/public-web-staging.test.mjs
          node bouncer/scripts/publish-web-preview.mjs
      - name: Verify the phone-sized public page without signing in
        env:
          BOUNCER_PREVIEW_URL_FILE: ${{ runner.temp }}/bouncer-preview-url.txt
        run: |
          npm install --prefix "$RUNNER_TEMP/bouncer-browser" --no-save --no-audit --no-fund playwright-core@1.64.1
          node bouncer/scripts/test-public-web-preview.mjs

  github-pages-path-smoke:
    # Offline path simulation only; no Pages site is published.
    if: contains(github.event.head_commit.message, '[test-github-pages]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test nested static site and disabled account endpoint
        run: |
          npm install --prefix "$RUNNER_TEMP/bouncer-browser" --no-save --no-audit --no-fund playwright-core@1.64.1
          node bouncer/scripts/test-github-pages-path.mjs

  durable-site-smoke:
    # Only after a production deployment; never signs in or sends a payment.
    if: contains(github.event.head_commit.message, '[test-live-site]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check reviewed production bytes and mobile navigation
        env:
          BOUNCER_PREVIEW_URL_FILE: ${{ runner.temp }}/bouncer-preview-url.txt
        run: |
          printf '%s\n' 'https://bouncer-near.vercel.app/' > "$BOUNCER_PREVIEW_URL_FILE"
          npm install --prefix "$RUNNER_TEMP/bouncer-browser" --no-save --no-audit --no-fund playwright-core@1.64.1
          node bouncer/scripts/check-public-web-assets.mjs
          node bouncer/scripts/test-public-web-preview.mjs
