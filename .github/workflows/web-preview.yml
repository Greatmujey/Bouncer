name: One-shot public website preview

on:
  push:
    branches: [main, 'arena/**']

# This job only runs on an explicit marker. The guest upload is public and
# temporary; it never changes the visibility of the private repository.
jobs:
  public-preview:
    if: contains(github.event.head_commit.message, '[publish-web-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test snapshot and optional read-only RPC client
        run: node --test bouncer/tests/web.test.mjs
      - name: Upload only the static website
        env:
          BOUNCER_PREVIEW_URL_FILE: ${{ runner.temp }}/bouncer-preview-url.txt
        run: |
          set +e
          node bouncer/scripts/publish-web-preview.mjs 2>&1 | tee "$RUNNER_TEMP/publish-preview.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-2000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Preview publish failed::"+s)' "$RUNNER_TEMP/publish-preview.log"
          fi
          exit "$result"
      - name: Verify the public page in a phone-sized browser
        env:
          BOUNCER_PREVIEW_URL_FILE: ${{ runner.temp }}/bouncer-preview-url.txt
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/bouncer-browser" --no-save --no-audit --no-fund playwright-core@1.64.1
          set +e
          node bouncer/scripts/test-public-web-preview.mjs 2>&1 | tee "$RUNNER_TEMP/web-browser.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8").slice(-2000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Public browser test failed::"+s)' "$RUNNER_TEMP/web-browser.log"
          fi
          exit "$result"

  github-pages-path-smoke:
    # Offline path/origin simulation only: never contacts or publishes Pages.
    if: contains(github.event.head_commit.message, '[test-github-pages]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the staged site at the GitHub Pages project path
        run: |
          npm install --prefix "$RUNNER_TEMP/bouncer-browser" --no-save --no-audit --no-fund playwright-core@1.64.1
          node bouncer/scripts/test-github-pages-path.mjs

  near-cli-offline-smoke:
    # Real near-cli-rs signs only a random throwaway off-chain message with a
    # synthetic local credential. The RPC and wallet are mocked; no spending.
    if: contains(github.event.head_commit.message, '[test-near-cli]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bouncer --no-audit --no-fund
      - name: Exercise real CLI with a synthetic local credential
        env:
          GH_TOKEN: ${{ github.token }}
          BOUNCER_PLAYWRIGHT_PATH: ${{ runner.temp }}/bouncer-browser/node_modules/playwright-core/index.mjs
          BOUNCER_CLI_EXECUTOR: ${{ runner.temp }}/near-cli-executor.js
          BOUNCER_REAL_CLI_PATH: ${{ runner.temp }}/near-cli/node_modules/.bin/near
        shell: bash
        run: |
          set -o pipefail
          npm install --prefix "$RUNNER_TEMP/bouncer-browser" --no-save --no-audit --no-fund playwright-core@1.64.1
          npm install --prefix "$RUNNER_TEMP/near-cli" --no-save --no-audit --no-fund near-cli-rs@0.30.1
          gh api repos/near/near-cli-connect/git/blobs/32f1a33250370b5250a72d68ce24459628069fd7 --jq .content | base64 -d > "$BOUNCER_CLI_EXECUTOR"
          node bouncer/scripts/test-web-browser.mjs

  durable-site-smoke:
    # Public asset checks; the optional relay probe creates and cancels a
    # proposal without approving a wallet, signing, or spending.
    if: contains(github.event.head_commit.message, '[test-durable-web]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify publicly served assets and private paths
        run: node bouncer/scripts/check-public-web-assets.mjs
      - name: Exercise the public site on a phone-sized browser
        env:
          BOUNCER_PREVIEW_URL_FILE: ${{ runner.temp }}/bouncer-production-url.txt
          BOUNCER_TEST_WALLETCONNECT_RELAY: ${{ contains(github.event.head_commit.message, '[test-walletconnect-relay]') && '1' || '0' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/bouncer-browser" --no-save --no-audit --no-fund playwright-core@1.64.1
          printf '%s\n' 'https://bouncer-near.vercel.app/' > "$BOUNCER_PREVIEW_URL_FILE"
          node bouncer/scripts/test-public-web-preview.mjs
