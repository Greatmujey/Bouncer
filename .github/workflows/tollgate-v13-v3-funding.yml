# Read-only testnet funding and original-reference observations. Never signs,
# sends, opens a channel, restores keys or contacts the seller.
name: Inspect V3 funding for V13 data (read only)
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  inspect:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[tollgate-v13-v3-funding]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/tollgate-v13-funding.test.mjs tests/observe-original-reference.test.mjs tests/read-only-near-receipts.test.mjs
      - name: Observe funding and both original references
        run: |
          set -euo pipefail
          node scripts/inspect-tollgate-v13-funding-v3.mjs > "$RUNNER_TEMP/v13-funding.json"
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/v13-funding.json")),separators=(",",":")); print("::notice title=Read-only V13 funding snapshot::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Testnet V13 funding estimate'; echo 'No transactions, private keys, channel or provider contact. Estimates are not authorization.'; echo '```json'; cat "$RUNNER_TEMP/v13-funding.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
