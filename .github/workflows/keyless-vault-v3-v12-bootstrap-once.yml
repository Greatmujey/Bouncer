# ONE-SHOT TESTNET KEYLESS V12 DEPLOYMENT. The original signed bytes are a
# public bearer: anyone may relay the exact six-test-NEAR action before CI.
# Never resend an unresolved original. This workflow receives no private key.
name: Deploy backed-up owner keyless V12 testnet vault once
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    if: github.event.before == 'f60fce7076f5dac8f534093a51189e29ac0ed531' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[keyless-vault-v3-v12-bootstrap-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Retrieve the pinned public V12 WASM for safety tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Greatmujey/Bouncer/git/blobs/16785505eaed13609d8e569e7b1665f89683d9eb --jq .content | base64 -d > "$RUNNER_TEMP/v12-testnet.wasm"
          printf '%s  %s\n' '033f255c5822ff97495809f7d60fddf66f266f20c36285fe71296b66decc6d12' "$RUNNER_TEMP/v12-testnet.wasm" | sha256sum -c -
          test "$(wc -c < "$RUNNER_TEMP/v12-testnet.wasm")" -eq 536651
      - name: Test fixed deployment, fence and original recovery safeguards
        env:
          BOUNCER_V12_WASM: ${{ runner.temp }}/v12-testnet.wasm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/keyless-vault-v12*.test.mjs tests/read-only-near-receipts.test.mjs tests/github-original-fence.test.mjs
      - name: Prepare original-hash fence
        id: fence_info
        run: |
          set -euo pipefail
          file='evidence/testnet-owner-v3/vault-v12-bootstrap-original.json'
          test -f "$file"
          digest="$(sha256sum "$file" | cut -d' ' -f1)"
          echo "sha=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/vault-v12-fence"
          cp "$file" "$RUNNER_TEMP/vault-v12-fence/vault-v12-bootstrap-original.json"
          printf 'network=testnet\nrun_id=%s\ncommit=%s\nenvelope_sha256=%s\nrequest=one original V12 keyless testnet vault; reconcile, never blindly resend\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$digest" > "$RUNNER_TEMP/vault-v12-fence/attempt.txt"
      - name: Retain original-hash fence before CI send
        id: fence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vault-v3-v12-bootstrap-fence-${{ github.run_id }}-${{ steps.fence_info.outputs.sha }}
          path: ${{ runner.temp }}/vault-v12-fence/
          retention-days: 30
          if-no-files-found: error
      - name: Recheck fresh state and canonical original, submit once, and verify original receipts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOUNCER_FENCE_ARTIFACT_ID: ${{ steps.fence.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if ! node scripts/broadcast-keyless-vault-v12-once.mjs > "$RUNNER_TEMP/vault-v12-result.json" 2> "$RUNNER_TEMP/vault-v12-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/vault-v12-error.log").read()[-4000:]; print("::error title=Original V12 vault unconfirmed; do not retry::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## Original V3 keyless V12 testnet vault deployment'
            echo 'Six test NEAR may remain locked. No Circle vault registration, vault USDC funding, independent audit or seller delivery is implied.'
            echo '```json'
            cat "$RUNNER_TEMP/vault-v12-result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; p=os.environ["RUNNER_TEMP"]+"/vault-v12-result.json"; s=json.dumps(json.load(open(p)),separators=(",",":")); print("::notice title=V12 keyless vault bootstrap result::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
