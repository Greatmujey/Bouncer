# ONE-SHOT TESTNET ONLY. Creates exactly the user-requested, previously absent
# named account using a locally generated public key. The private key never
# enters GitHub. The public plan is fenced before the only helper request;
# uncertain results must be reconciled, never re-run or retried.
name: Recover named testnet account once

on:
  push:
    branches: ['arena/25a7aaf6-near-hub']

permissions:
  contents: read
  actions: read

jobs:
  recovery:
    if: github.event.before == '82b558227f29e84254c445acecc3d165d0593357' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[named-testnet-recovery-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install lockfile and test one-shot safeguards
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/named-testnet-inventory.test.mjs tests/named-testnet-recovery.test.mjs tests/github-original-fence.test.mjs
      - name: Prepare public-only intent fence
        id: plan
        run: |
          set -euo pipefail
          digest="$(sha256sum config/greatmujey-testnet-claim.json | cut -d' ' -f1)"
          echo "sha=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/named-recovery-fence"
          cp config/greatmujey-testnet-claim.json "$RUNNER_TEMP/named-recovery-fence/public-plan.json"
          printf 'network=testnet\nrun_id=%s\ncommit=%s\nplan_sha256=%s\nrequest=at-most-once; reconcile, do not repeat\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$digest" > "$RUNNER_TEMP/named-recovery-fence/attempt.txt"
      - name: Durably retain the public intent before any helper request
        id: fence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: named-testnet-recovery-fence-${{ github.run_id }}-${{ steps.plan.outputs.sha }}
          path: ${{ runner.temp }}/named-recovery-fence/
          retention-days: 30
          if-no-files-found: error
      - name: Request once and verify public FINAL state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOUNCER_FENCE_ARTIFACT_ID: ${{ steps.fence.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if ! node scripts/recover-named-testnet-once.mjs > "$RUNNER_TEMP/named-result.json" 2> "$RUNNER_TEMP/named-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/named-error.log").read()[-3000:]; print("::error title=Named testnet recovery stopped; do not retry::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## Named testnet account recovery'
            echo 'One helper request at most, after a public fence and fresh absent-account/Circle checks. Only public FINAL views follow. The private key stayed local; off-device backup is not verified. No signed transaction, vault deposit or seller contact occurred.'
            echo '```json'
            cat "$RUNNER_TEMP/named-result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; d=json.load(open(os.environ["RUNNER_TEMP"]+"/named-result.json")); s=json.dumps(d,separators=(",",":")); print("::notice title=Named testnet account recovery::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
