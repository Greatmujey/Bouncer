# Read-only original-hash recovery. Never signs or submits a transaction.
name: Reconcile replacement keyless vault (read only)

on:
  push:
    branches: ['arena/25a7aaf6-near-hub']

permissions:
  contents: read

jobs:
  reconcile:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[keyless-vault-v2-reconcile]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies and test the read-only receipt transport
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/read-only-near-receipts.test.mjs
      - name: Reconcile only the retained original hash and fresh state
        run: |
          set -euo pipefail
          if ! node scripts/reconcile-keyless-vault-v2.mjs > "$RUNNER_TEMP/reconcile.json" 2> "$RUNNER_TEMP/reconcile-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/reconcile-error.log").read()[-3000:]; print("::error title=Original vault remains unresolved; do not resend::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## Read-only reconciliation of the exact original vault deployment'
            echo 'No signing, sending or provider purchase. An RPC can still be stale or dishonest.'
            echo '```json'
            cat "$RUNNER_TEMP/reconcile.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/reconcile.json")),separators=(",",":")); print("::notice title=Replacement keyless vault original reconciliation::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
