# Bounded Ref testnet path discovery; no signers, broadcasts or reservations.
name: Ref Circle paths (read only)

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ref-circle-paths]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test discovery boundaries
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/ref-circle-discovery.test.mjs
      - name: Inspect bounded routes at one FINAL block
        run: |
          set -euo pipefail
          node scripts/inspect-ref-circle-paths.mjs > "$RUNNER_TEMP/ref-paths.json"
          python3 - <<'PY'
          import json, os
          p = os.environ['RUNNER_TEMP'] + '/ref-paths.json'
          data = json.load(open(p))
          text = json.dumps(data, separators=(',', ':'), ensure_ascii=True)
          assert len(text) < 12000
          print('::notice title=Ref testnet Circle path discovery::' + text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          { echo '## Ref testnet Circle paths: read-only, bounded search';
            echo 'No trade, order, signature, seller contact or payment. Intermediate tokens, owner history, storage and swap execution are not verified.';
            echo '```json'; cat "$RUNNER_TEMP/ref-paths.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
