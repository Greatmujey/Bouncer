# Public testnet views only. No private keys, signatures, swaps or seller contact.
name: Testnet owner acquisition preflight (read only)

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[owner-acquisition-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install lockfile and test FINAL-view guards
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/circle-owner-acquisition-readiness.test.mjs tests/circle-owner-registration.test.mjs
      - name: Inspect the owner, wNEAR, Circle and Ref at one FINAL block
        run: |
          set -euo pipefail
          if ! node scripts/inspect-owner-acquisition.mjs > "$RUNNER_TEMP/owner-acquisition.json" 2> "$RUNNER_TEMP/owner-acquisition-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/owner-acquisition-error.log").read()[-3000:]; print("::error title=Read-only acquisition views unavailable::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## Public testnet acquisition snapshot'
            echo 'All views use one fresh FINAL block from the selected RPC. Prices can change. No keys, signatures, wrapping, swaps or seller requests were used.'
            echo '```json'
            cat "$RUNNER_TEMP/owner-acquisition.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; p=os.environ["RUNNER_TEMP"]+"/owner-acquisition.json"; s=json.dumps(json.load(open(p)),separators=(",",":")); print("::notice title=Public owner acquisition preflight::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
