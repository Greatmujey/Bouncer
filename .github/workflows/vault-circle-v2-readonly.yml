# Public testnet views only. No signature, transaction or seller contact.
name: Replacement vault Circle preflight (read only)

on:
  push:
    branches: ['arena/25a7aaf6-near-hub']

permissions:
  contents: read

jobs:
  inspect:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[vault-circle-v2-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Retrieve pinned public V11 artifact for offline journal tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Greatmujey/Bouncer/git/blobs/c67c70401dc733a0905e79258cc8169c2e6b5210 --jq .content | base64 -d > "$RUNNER_TEMP/v11-testnet.wasm"
          printf '%s  %s\n' '1acf931c07a530257999478c121193863ecf7201d357812a44b4d61c16a77921' "$RUNNER_TEMP/v11-testnet.wasm" | sha256sum -c -
      - name: Test vault Circle guards and original-hash recovery
        env:
          BOUNCER_V11_WASM: ${{ runner.temp }}/v11-testnet.wasm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/keyless-vault-circle*.test.mjs tests/github-original-fence.test.mjs tests/read-only-near-receipts.test.mjs
      - name: Inspect owner, keyless vault and Circle at one FINAL block
        run: |
          set -euo pipefail
          if ! node scripts/inspect-vault-circle-v2.mjs > "$RUNNER_TEMP/circle-vault-preflight.json" 2> "$RUNNER_TEMP/circle-vault-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/circle-vault-error.log").read()[-3000:]; print("::error title=Replacement vault Circle preflight unavailable::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## Read-only Circle testnet vault preflight'
            echo 'No private keys, signing, transaction or seller. This is a trusted-RPC view, not a code audit or proof of backups.'
            echo '```json'
            cat "$RUNNER_TEMP/circle-vault-preflight.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/circle-vault-preflight.json")),separators=(",",":")); print("::notice title=Replacement vault Circle preflight::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
