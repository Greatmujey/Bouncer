# Runtime-check the exact public build-comparison artifact on an isolated chain.
# Ephemeral accounts and synthetic token/receiver only; no testnet funds.
name: V12 pinned artifact sandbox
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
jobs:
  sandbox:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[v12-pinned-sandbox]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install lockfile and test sandbox guards
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/v12-pair-lock-sandbox.test.mjs tests/v11-sandbox-harness.test.mjs tests/v11-sandbox-setup-rpc.test.mjs
      - name: Retrieve exact V12 and synthetic FT artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Greatmujey/Bouncer/git/blobs/16785505eaed13609d8e569e7b1665f89683d9eb --jq .content | base64 --decode > "$RUNNER_TEMP/bouncer-v12.wasm"
          echo '033f255c5822ff97495809f7d60fddf66f266f20c36285fe71296b66decc6d12  '"$RUNNER_TEMP/bouncer-v12.wasm" | sha256sum -c -
          test "$(wc -c < "$RUNNER_TEMP/bouncer-v12.wasm")" -eq 536651
          gh api repos/near/nearcore/git/blobs/3ab410d723c8029e70993b0829a17ddd52d8b135 --jq .content | base64 --decode > "$RUNNER_TEMP/mock-ft.wasm"
          echo 'b10ed11ac6d60698c6809ef7e96b578f2e5768354fe4b15d044843c2b6ab8a04  '"$RUNNER_TEMP/mock-ft.wasm" | sha256sum -c -
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 --max-time 180 --retry 2 --max-filesize 419430400 \
            'https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.14.0/near-sandbox.tar.gz' \
            --output "$RUNNER_TEMP/near-sandbox.tar.gz"
          python3 scripts/extract-pinned-near-sandbox.py "$RUNNER_TEMP/near-sandbox.tar.gz" "$RUNNER_TEMP/near-sandbox"
          echo "BOUNCER_V12_WASM_PATH=$RUNNER_TEMP/bouncer-v12.wasm" >> "$GITHUB_ENV"
          echo "BOUNCER_SANDBOX_BIN=$RUNNER_TEMP/near-sandbox" >> "$GITHUB_ENV"
          echo "BOUNCER_MOCK_FT_WASM_PATH=$RUNNER_TEMP/mock-ft.wasm" >> "$GITHUB_ENV"
      - name: Exercise exact artifact in isolated nearcore
        run: |
          set -euo pipefail
          ulimit -Sn 65535
          node integration/v12-pair-lock-sandbox.mjs > "$RUNNER_TEMP/v12-pinned-result.json"
          python3 -c 'import os,json; p=os.environ["RUNNER_TEMP"]+"/v12-pinned-result.json"; s=json.dumps(json.load(open(p)),separators=(",",":")); print("::notice title=Pinned V12 sandbox result::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Exact V12 artifact on isolated nearcore'; echo 'Synthetic FT and receiver only; not testnet, Circle, OutLayer, an independent audit or provider delivery.'; echo '```json'; cat "$RUNNER_TEMP/v12-pinned-result.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
