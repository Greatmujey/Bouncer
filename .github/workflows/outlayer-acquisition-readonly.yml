# Pinned preflight plus read-only original control/registration/wrap receipts.
name: Inspect OutLayer acquisition stage (read only)
on:
  push:
    branches: ['arena/**']
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[outlayer-acquisition-readonly:')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/outlayer-burn-acquisition.test.mjs tests/outlayer-registration-after-control.test.mjs tests/outlayer-v11-burn-preflight.test.mjs tests/github-original-fence.test.mjs tests/keyless-vault-circle.test.mjs
      - name: Inspect one stage and its original parents
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          stage="$(python3 -c 'import os,re; x=re.findall(r"\[outlayer-acquisition-readonly:(wrap|swap-fake|fund-vault)\]",os.environ["COMMIT_MESSAGE"]); assert len(x)==1; print(x[0])')"
          if [ "$stage" = fund-vault ]; then script='scripts/inspect-outlayer-funding.mjs'; else script='scripts/inspect-outlayer-acquisition.mjs'; fi
          if ! node "$script" "$stage" > "$RUNNER_TEMP/outlayer-acquisition.json" 2> "$RUNNER_TEMP/outlayer-acquisition-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/outlayer-acquisition-error.log").read()[-2500:]; print("::error title=Acquisition state unknown::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/outlayer-acquisition.json")),separators=(",",":")); print("::notice title=OutLayer acquisition original-bound preflight::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Read-only acquisition preflight'; echo 'Prior FINAL receipts and fresh public state only; no signing, send or seller payment.'; echo '```json'; cat "$RUNNER_TEMP/outlayer-acquisition.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
