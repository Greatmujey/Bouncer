# Read-only testnet preflight: no private keys, quotes, signatures or payments.
name: Independent Buffer funding readiness (read only)

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[buffer-live-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test pinned views and receipt boundaries
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/buffer-live-readiness.test.mjs tests/buffer-wallet-readiness.test.mjs tests/buffer-delivery-evidence.test.mjs tests/read-only-near-receipts.test.mjs
      - name: Retrieve the pinned V12 artifact and test unsigned wallet setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOUNCER_V12_WASM_PATH: ${{ runner.temp }}/v12-reviewed.wasm
        run: |
          set -euo pipefail
          gh api repos/Greatmujey/Bouncer/git/blobs/16785505eaed13609d8e569e7b1665f89683d9eb --jq .content | base64 -d > "$BOUNCER_V12_WASM_PATH"
          printf '%s  %s\n' '033f255c5822ff97495809f7d60fddf66f266f20c36285fe71296b66decc6d12' "$BOUNCER_V12_WASM_PATH" | sha256sum -c -
          test "$(wc -c < "$BOUNCER_V12_WASM_PATH")" -eq 536651
          node --test tests/buffer-wallet-setup-plan.test.mjs tests/buffer-wallet-connector-compat.test.mjs
      - name: Inspect V12, Buffer and indicative Ref returns at one FINAL block
        run: |
          set -euo pipefail
          node scripts/inspect-buffer-live-readiness.mjs > "$RUNNER_TEMP/buffer-readiness.json"
          python3 - <<'PY'
          import json, os
          p = os.environ['RUNNER_TEMP'] + '/buffer-readiness.json'
          data = json.load(open(p))
          s = json.dumps(data, separators=(',', ':'), ensure_ascii=True)
          assert len(s) < 12000
          print('::notice title=Buffer read-only readiness::' + s.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          { echo '## Independent Buffer: read-only testnet preflight';
            echo 'One trusted-RPC FINAL block; no seller HTTP call, quote, order, transaction, signature or authorization. Ref values are indications only. Historical owner transaction outcomes remain unknown.';
            echo '```json'; cat "$RUNNER_TEMP/buffer-readiness.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect the user-named wallet and a fresh candidate vault
        run: |
          set -euo pipefail
          node scripts/inspect-buffer-wallet-readiness.mjs > "$RUNNER_TEMP/buffer-wallet.json"
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.environ['RUNNER_TEMP'] + '/buffer-wallet.json'))
          s = json.dumps(data, separators=(',', ':'), ensure_ascii=True)
          assert len(s) < 12000
          print('::notice title=User testnet wallet and Buffer funding readiness::' + s.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          { echo '## User-named testnet account: read-only funding indication';
            echo 'Only public account, token, seller and protocol views. No wallet ownership, consent, deployment, seller order or payment is established.';
            echo '```json'; cat "$RUNNER_TEMP/buffer-wallet.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare an unsigned reviewed setup, if all wallet checks pass
        run: |
          set -euo pipefail
          if ! node scripts/prepare-buffer-wallet-setup.mjs "$RUNNER_TEMP/buffer-wallet.json" "$RUNNER_TEMP/v12-reviewed.wasm" > "$RUNNER_TEMP/buffer-wallet-plan.json" 2> "$RUNNER_TEMP/buffer-wallet-plan-error.log"; then
            echo '::warning title=Unsigned wallet setup unavailable::The snapshot is blocked, changed or stale. No action or wallet request was made.'
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.environ['RUNNER_TEMP'] + '/buffer-wallet-plan.json'))
          s = json.dumps(data, separators=(',', ':'), ensure_ascii=True)
          assert len(s) < 12000
          print('::notice title=Unsigned wallet setup review::' + s.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          { echo '## Unsigned setup review — no wallet approval or transaction';
            echo 'A keyless deployment may lock its storage stake. Recheck each stage, obtain separate wallet approval and reconcile by original transaction before continuing.';
            echo '```json'; cat "$RUNNER_TEMP/buffer-wallet-plan.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Probe the retired wallet redirect with inert request lengths
        run: |
          set -euo pipefail
          node --test tests/mynearwallet-redirect-probe.test.mjs
          if ! node scripts/inspect-mynearwallet-redirect.mjs "$RUNNER_TEMP/buffer-wallet.json" "$RUNNER_TEMP/v12-reviewed.wasm" > "$RUNNER_TEMP/wallet-url-probe.json" 2> "$RUNNER_TEMP/wallet-url-probe-error.log"; then
            echo '::warning title=Wallet URL probe unavailable::No transaction or wallet request was sent; compatibility remains unknown.'
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.environ['RUNNER_TEMP'] + '/wallet-url-probe.json'))
          s = json.dumps(data, separators=(',', ':'), ensure_ascii=True)
          assert len(s) < 12000
          print('::notice title=MyNearWallet inert URL-size probe::' + s.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
          { echo '## MyNearWallet URL compatibility probe — no transaction or sign-in';
            echo 'Only HEAD requests containing inert padding. HTTP acceptance does not establish that any browser session or signing works.';
            echo '```json'; cat "$RUNNER_TEMP/wallet-url-probe.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
