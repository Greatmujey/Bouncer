# ONE-SHOT TESTNET KEYLESS V11 DEPLOYMENT. The original signed bytes are a
# public bearer: anyone can relay the exact six-test-NEAR action before CI.
# Never resend an unresolved original. No private key is sent to this workflow.
name: Deploy replacement keyless testnet vault once

on:
  push:
    branches: ['arena/25a7aaf6-near-hub']

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event.before == '7d5e01b3d6d1c14f5b04eba9aa85214b049e13c6' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[keyless-vault-v2-bootstrap-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Retrieve public pinned WASM for safety tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Greatmujey/Bouncer/git/blobs/c67c70401dc733a0905e79258cc8169c2e6b5210 --jq .content | base64 -d > "$RUNNER_TEMP/v11-testnet.wasm"
          printf '%s  %s\n' '1acf931c07a530257999478c121193863ecf7201d357812a44b4d61c16a77921' "$RUNNER_TEMP/v11-testnet.wasm" | sha256sum -c -
          test "$(wc -c < "$RUNNER_TEMP/v11-testnet.wasm")" -eq 536325
      - name: Test fixed deployment, fence and recovery safeguards
        env:
          BOUNCER_V11_WASM: ${{ runner.temp }}/v11-testnet.wasm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/keyless-vault-bootstrap*.test.mjs tests/read-only-near-receipts.test.mjs tests/github-original-fence.test.mjs
      - name: Prepare original-hash fence
        id: fence_info
        run: |
          set -euo pipefail
          file='evidence/testnet-owner-v2/vault-bootstrap-original.json'
          test -f "$file"
          digest="$(sha256sum "$file" | cut -d' ' -f1)"
          echo "sha=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/vault-fence"
          cp "$file" "$RUNNER_TEMP/vault-fence/vault-bootstrap-original.json"
          printf 'network=testnet\nrun_id=%s\ncommit=%s\nenvelope_sha256=%s\nrequest=one original keyless testnet vault; reconcile, never blindly resend\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$digest" > "$RUNNER_TEMP/vault-fence/attempt.txt"
      - name: Retain original-hash fence before CI send
        id: fence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vault-v2-bootstrap-fence-${{ github.run_id }}-${{ steps.fence_info.outputs.sha }}
          path: ${{ runner.temp }}/vault-fence/
          retention-days: 30
          if-no-files-found: error
      - name: Recheck fresh state, submit once, and verify original receipts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOUNCER_FENCE_ARTIFACT_ID: ${{ steps.fence.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if ! node scripts/broadcast-keyless-vault-v2-once.mjs > "$RUNNER_TEMP/vault-result.json" 2> "$RUNNER_TEMP/vault-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/vault-error.log").read()[-4000:]; print("::error title=Original vault unconfirmed; do not retry::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          {
            echo '## Original replacement keyless testnet vault deployment'
            echo 'Six test NEAR may remain locked. No Circle vault registration, vault USDC funding, independent audit or seller delivery is implied.'
            echo '```json'
            cat "$RUNNER_TEMP/vault-result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os,json; p=os.environ["RUNNER_TEMP"]+"/vault-result.json"; s=json.dumps(json.load(open(p)),separators=(",",":")); print("::notice title=Replacement keyless vault bootstrap result::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
