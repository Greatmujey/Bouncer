# ONE-SHOT TESTNET FAKE-TOKEN SWAP. Public bearer can be independently relayed.
name: Swap wrapped test NEAR for fake compute token once
on:
  push:
    branches: ['arena/25a7aaf6-near-hub']
permissions:
  contents: read
  actions: read
jobs:
  swap:
    if: github.event.before == '82283b43a72c7026b1ad713b0d4c105a2b2125ee' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[outlayer-swap-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bouncer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test acquisition originals and fences
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/outlayer-burn-acquisition.test.mjs tests/outlayer-registration-after-control.test.mjs tests/outlayer-v11-burn-signed.test.mjs tests/github-original-fence.test.mjs
      - name: Prepare original-hash fence
        id: plan
        run: |
          set -euo pipefail
          file='evidence/testnet-owner-v2/outlayer-burn-swap-original.json'
          digest="$(sha256sum "$file" | cut -d' ' -f1)"
          echo "sha=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/outlayer-burn-swap-fence"
          cp "$file" "$RUNNER_TEMP/outlayer-burn-swap-fence/original.json"
          printf 'network=testnet\nstage=swap-fake\nrun_id=%s\ncommit=%s\noriginal_envelope_sha256=%s\nrequest=one fake-token swap; reconcile, never resend\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$digest" > "$RUNNER_TEMP/outlayer-burn-swap-fence/attempt.txt"
      - name: Retain original before the one send
        id: fence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: outlayer-burn-swap-fence-${{ github.run_id }}-${{ steps.plan.outputs.sha }}
          path: ${{ runner.temp }}/outlayer-burn-swap-fence/
          retention-days: 30
          if-no-files-found: error
      - name: Reverify originals, recheck state and send once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOUNCER_FENCE_ARTIFACT_ID: ${{ steps.fence.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if ! node scripts/broadcast-outlayer-swap-once.mjs > "$RUNNER_TEMP/outlayer-swap.json" 2> "$RUNNER_TEMP/outlayer-swap-error.log"; then
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/outlayer-swap-error.log").read()[-2500:]; print("::error title=Original swap unknown; never resend::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          python3 -c 'import os,json; s=json.dumps(json.load(open(os.environ["RUNNER_TEMP"]+"/outlayer-swap.json")),separators=(",",":")); print("::notice title=OutLayer original swap result::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          { echo '## Fixed testnet fake-token swap'; echo 'No seller payment or delivery.'; echo '```json'; cat "$RUNNER_TEMP/outlayer-swap.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
