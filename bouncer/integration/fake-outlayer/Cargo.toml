# Isolated nearcore fixture only. This is NOT the OutLayer provider and must
# never be deployed as, or represented as, an independent service.
[package]
name = "bouncer-fake-outlayer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "=5.30.0"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }

[profile.release]
panic = "abort"
overflow-checks = false
codegen-units = 1
opt-level = "s"
lto = false
debug = false
strip = "debuginfo"
