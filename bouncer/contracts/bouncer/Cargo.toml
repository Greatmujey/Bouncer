[package]
name = "bouncer"
version = "0.1.0"
edition = "2021"
description = "On-chain comptroller for AI agents on NEAR"
repository = "https://github.com/abdullahimujeeb0505-stack/Bouncer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.14", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.14", default-features = false, features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = false
debug = false
panic = "abort"
overflow-checks = true
strip = false
