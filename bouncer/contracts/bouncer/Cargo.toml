[package]
name = "bouncer"
version = "0.1.0"
edition = "2021"
description = "Policy-enforced spending vault for AI agents on NEAR"
repository = "https://github.com/USERNAME/near-bouncer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.14", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5.14", features = ["legacy", "unit-testing"] }
tokio = { version = "1", features = ["macros"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
