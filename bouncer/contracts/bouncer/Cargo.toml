[package]
name = "bouncer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
# Experimental, separately built testnet artifacts; default V9 is unchanged.
youtick-playback-v10 = []
exact-ft-v11 = []
# Fresh-state-only hardening; does not change or upgrade deployed V11 vaults.
exact-ft-v12 = ["exact-ft-v11"]
# Experimental native-channel support; fresh state only, never a V12 upgrade.
tollgate-native-v13 = ["exact-ft-v12"]
# Separate fresh-state testnet artifact. Public NEAR on-chain storage; not an
# upgrade to an existing vault and not an independent storage provider.
native-storage-v14 = []

[dependencies]
# Keep experimental testnet artifacts on the captured lockfile resolution.
near-sdk = "=5.30.0"

[profile.release]
panic = "abort"
overflow-checks = false
codegen-units = 1
opt-level = "s"
lto = false
debug = false
strip = "debuginfo"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
