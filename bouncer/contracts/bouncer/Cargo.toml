[package]
name = "bouncer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.14"

[profile.release]
panic = "abort"
overflow-checks = false
codegen-units = 1
opt-level = "s"
lto = false
debug = false
strip = "debuginfo"

[dev-dependencies]
near-sdk = { version = "5.14", features = ["unit-testing"] }
